        id: policy-rule
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/fixtures/${{ matrix.language }}/policy-fail/${{ matrix.rule }}
          expected-failure: true
        continue-on-error: true
      - name: assert mandatory policy failed
        env:
          ERROR_MESSAGE: ${{ steps.policy-rule.outputs.error_message }}
        run: |
          [[ "${{ steps.policy-rule.outcome }}" == "failure" ]] || {
            echo "::error::Expected mandatory policy ${{ matrix.rule }} to fail"
