name: Quality Gate (Go)
description: Run portable Go quality checks through the GitHub adapter.
inputs:
  check:
    description: The quality check to run.
    required: true
  working-directory:
    description: The project directory to check.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: go | setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ inputs.working-directory }}/go.mod
        cache: true
    - name: go | run portable check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
        QUALITY_GATE_ERROR_FILE: ${{ runner.temp }}/quality-gate-error.txt
      run: |
        set -euo pipefail
        bash "${ACTION_DIRECTORY}/scripts/check.sh" \
          --check "$CHECK" \
          --working-directory "$PWD" \
          --action-directory "$ACTION_DIRECTORY"
