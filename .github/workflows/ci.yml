name: CI

# dogfooding
on:
  push:
    branches: [master, feat/**, quality-gate]
  # pull_request:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run SAST (local action)
        uses: ./sast
        with:
          sonar_url: ${{ vars.SONARQUBE_URL }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          dd_url: ${{ vars.DEFECTDOJO_URL }}
          dd_token: ${{ secrets.DEFECTDOJO_TOKEN }}
          ts_tags: tag:prefect-cicd
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

  ast-grep-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install ast-grep
        shell: bash
        run: |
          set -euo pipefail
          TOOL_BIN="$HOME/.ast-grep/bin"
          TOOL_DL="$HOME/.ast-grep/dl"
          mkdir -p "$TOOL_BIN" "$TOOL_DL"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"
          SG_OUT="$TOOL_DL/sg.zip"
          SG_SHA="76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63"
          if [[ ! -f "$SG_OUT" ]] || ! echo "$SG_SHA  $SG_OUT" | sha256sum -c --status; then
            curl -sfL \
              "https://github.com/ast-grep/ast-grep/releases/download/0.45.1/app-x86_64-unknown-linux-gnu.zip" \
              -o "$SG_OUT"
          fi
          echo "$SG_SHA  $SG_OUT" | sha256sum -c --status || {
            echo "::error title=strlint::sha256 mismatch for ast-grep"; rm -f "$SG_OUT"; exit 1
          }
          unzip -p "$SG_OUT" ast-grep > "$TOOL_BIN/ast-grep"
          chmod +x "$TOOL_BIN/ast-grep"
      - name: Test Go rules
        run: ast-grep test --skip-snapshot-tests --config quality-gate/go/sgconfig.yaml

