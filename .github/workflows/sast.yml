name: SAST

# Reusable workflow. Outros repos chamam assim:
#
#   jobs:
#     sast:
#       uses: prefeitura-rio/actions/.github/workflows/sast.yml@main
#       secrets:
#         dd_token: ${{ secrets.DEFECTDOJO_TOKEN }}
#         ts_tags: ...
#         ts_oauth_client_id: ...
#         ts_oauth_secret: ...

on:
  workflow_call:
    inputs:
      sonar_url:
        description: Obsoleto, ignorado (SonarQube foi removido)
        type: string
        required: false
        default: ""
      wait_pipeline:
        description: Obsoleto, ignorado (SonarQube foi removido)
        type: string
        required: false
        default: "true"
      break_on:
        description: Severidade de grype/opengrep que falha o job (CRITICAL/HIGH/MEDIUM/LOW)
        type: string
        required: false
        default: "HIGH"
      enable_clippy:
        description: Obsoleto, ignorado (SonarQube foi removido)
        type: string
        required: false
        default: "false"
      sonarqube_opts:
        description: Obsoleto, ignorado (SonarQube foi removido)
        type: string
        required: false
        default: ""
      override_branch:
        description: Sobrescreve o nome do engagement no DefectDojo
        type: string
        required: false
        default: ""
      ignore_type:
        description: Fonte da verdade para arquivos de ignore (sonarqube/semgrep)
        type: string
        required: false
        default: "sonarqube"
      dd_url:
        description: URL do DefectDojo (opcional)
        type: string
        required: false
        default: ""
      runs_on:
        description: Runner a usar (precisa ser linux/amd64)
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      sonar_token:
        description: Obsoleto, ignorado (SonarQube foi removido)
        required: false
      dd_token:
        required: true
      ts_tags:
        description: Tailscale tags
        required: true
      ts_oauth_client_id:
        description: Tailscale OAuth client ID
        required: true
      ts_oauth_secret:
        description: Tailscale OAuth secret
        required: true

permissions:
  contents: read

jobs:
  sast:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run SAST
        # $/ resolves to this repository at the commit the caller pinned.
        uses: $/sast
        with:
          break_on: ${{ inputs.break_on }}
          override_branch: ${{ inputs.override_branch }}
          ignore_type: ${{ inputs.ignore_type }}
          dd_url: ${{ inputs.dd_url }}
          dd_token: ${{ secrets.dd_token }}