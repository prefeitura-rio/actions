name: SAST Scanners action
description: Run Static Analysis and summarize results

inputs:
  wait_pipeline:
    description: Deprecated, ignored (SonarQube was removed)
    required: false
    default: "true"
  break_on:
    description: Fail when grype or opengrep report a finding at or above this severity (CRITICAL/HIGH/MEDIUM/LOW); any other value disables the gate
    required: false
    default: "-"
  enable_clippy:
    description: Deprecated, ignored (SonarQube was removed)
    required: false
    default: "false"
  sonarqube_opts:
    description: Deprecated, ignored (SonarQube was removed)
    required: false
    default: ""
  override_branch:
    description: Overrides the DefectDojo engagement name (defaults to the branch name)
    required: false
    default: ""
  sonar_url:
    description: Deprecated, ignored (SonarQube was removed)
    required: false
    default: ""
  sonar_token:
    description: Deprecated, ignored (SonarQube was removed)
    required: false
    default: ""
  dd_url:
    required: false
    default: ""
  dd_token:
    required: false
    default: ""
  ignore_type:
    description: Deprecated, ignored (the source of the ignore files is picked from the files present; see scripts/normalize-ignores.sh)
    required: false
    default: "sonarqube"
  enable_checkov:
    description: Run checkov infrastructure-as-code scanning
    required: false
    default: "true"
  checkov_version:
    required: false
    default: "3.3.8"
  checkov_opts:
    description: Extra arguments passed to checkov (e.g. --skip-path node_modules --skip-check CKV_DOCKER_2)
    required: false
    default: ""
  ts_tags:
    description: Tailscale tags
    required: true
  ts_oauth_client_id:
    description: Tailscale OAuth client ID
    required: true
  ts_oauth_secret:
    description: Tailscale OAuth secret
    required: true

runs:
  using: composite
  steps:
    - name: Tailscale connect
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.ts_oauth_client_id }}
        oauth-secret: ${{ inputs.ts_oauth_secret }}
        tags: ${{ inputs.ts_tags }}
    - name: Setup environment
      if: always()
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        cache: 'pip'
        python-version: ''
    - name: Prepare tool cache
      id: tools
      if: always()
      shell: bash
      env:
        CHECKOV_VERSION: ${{ inputs.checkov_version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare-tool-cache.sh"
    - name: Restore tool cache
      if: always()
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.tools.outputs.dir }}
        key: ${{ steps.tools.outputs.key }}
    - name: Install scanner tools
      if: always()
      shell: bash
      env:
        ENABLE_CHECKOV: ${{ inputs.enable_checkov }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh"
    - name: Normalize ignore files
      shell: bash
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/normalize-ignores.sh"
    - name: Run opengrep
      if: always()
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/run-opengrep.sh"
    - name: Run Vulnerability scan & collect sbom
      if: always()
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CURRENT_BRANCH: ${{ github.ref_name }}
        DD_URL: ${{ inputs.dd_url || '' }}
        DD_API_TOKEN: ${{ inputs.dd_token || '' }}
        PRODUCT_NAME: ${{ github.repository }}
        ENGAGEMENT_NAME: "${{ inputs.override_branch || github.ref_name }}"
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-vulnerability-scan.sh"
    - name: Run checkov (IaC)
      if: always()
      shell: bash
      env:
        ENABLE_CHECKOV: ${{ inputs.enable_checkov }}
        CHECKOV_OPTS: ${{ inputs.checkov_opts }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/run-checkov.sh"
    - name: Showing issues to summary
      if: always()
      shell: bash
      env:
        BREAK_ON: ${{ inputs.break_on || 'HIGH' }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CURRENT_BRANCH: ${{ github.ref_name }}
        DD_URL: ${{ inputs.dd_url || '' }}
        DD_API_TOKEN: ${{ inputs.dd_token || '' }}
        PRODUCT_NAME: ${{ github.repository }}
        ENGAGEMENT_NAME: "${{ inputs.override_branch || github.ref_name }}"
        ENABLE_CHECKOV: ${{ inputs.enable_checkov }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/summary.sh"
