id: no-eval
language: Python
severity: error
message: >
  Avoid eval(), exec(), and compile(). They execute arbitrary strings as code
  and are a security risk. Use json.loads(), ast.literal_eval(), or a
  purpose-built parser instead.
rule:
  any:
    - pattern: eval($$$ARGS)
    - pattern: exec($$$ARGS)
    - pattern: compile($$$ARGS)
ignores:
  - "tests/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/conftest.py"
