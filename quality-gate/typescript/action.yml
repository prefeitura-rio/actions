name: Quality Gate (Typescript)
description: Run portable TypeScript quality checks through the GitHub adapter.
inputs:
  check:
    description: The quality check to run.
    required: true
  working-directory:
    description: The project directory to check.
    required: false
    default: .
outputs:
  framework:
    description: Detected frontend framework, or none for a plain TypeScript project.
    value: ${{ steps.ts-info.outputs.framework }}
runs:
  using: composite
  steps:
    - name: typescript | project metadata
      id: ts-info
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
        QUALITY_GATE_ERROR_FILE: ${{ runner.temp }}/quality-gate-error.txt
      run: |
        set -euo pipefail
        if ! output=$(node "${ACTION_DIRECTORY}/scripts/project-info.js" "$PWD" --check "$CHECK" 2>&1); then
          printf '%s\n' "$output" > "$QUALITY_GATE_ERROR_FILE"
          printf '%s\n' "$output"
          exit 1
        fi
        printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
    - name: typescript | setup pnpm
      if: (inputs.check == 'app:typecheck' || inputs.check == 'app:test') && steps.ts-info.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: ${{ steps.ts-info.outputs.version }}
    - name: typescript | setup Node.js
      if: inputs.check == 'app:typecheck' || inputs.check == 'app:test'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.working-directory }}/.node-version
        cache: ${{ steps.ts-info.outputs.manager }}
        cache-dependency-path: |
          ${{ inputs.working-directory }}/pnpm-lock.yaml
          ${{ inputs.working-directory }}/package-lock.json
    - name: typescript | run portable check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
        QUALITY_GATE_ERROR_FILE: ${{ runner.temp }}/quality-gate-error.txt
      run: |
        set -euo pipefail
        bash "${ACTION_DIRECTORY}/scripts/check.sh" \
          --check "$CHECK" \
          --working-directory "$PWD" \
          --action-directory "$ACTION_DIRECTORY"
