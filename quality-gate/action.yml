name: Quality Gate
description: >
  Language-agnostic quality gate. Detects the project language automatically
  (Go: go.mod · Python: pyproject.toml · TypeScript: package.json+tsconfig.json)
  and runs the requested check.

  Supported checks (via the `check` input):
    app:format    — format verification (fail on any diff, never auto-fix in CI)
    app:lint      — static analysis / linting
    app:strlint   — structural lint (ast-grep org rules + optional repo rules)
    app:typecheck — type checking and compilation verification
    app:test      — unit / integration tests

  All quality tools are installed from pinned, sha256-verified releases.
  No devenv or Nix dependency is required in the calling workflow.

inputs:
  check:
    description: >
      The quality check to run, in `app:<job>` form.
      Valid values: app:format | app:lint | app:strlint | app:typecheck | app:test
    required: true

runs:
  using: composite
  steps:

    # ── 0. Validate input ──────────────────────────────────────────────────────
    - name: Validate check input
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        VALID="app:format app:lint app:strlint app:typecheck app:test"
        if ! echo "$VALID" | grep -qw "$CHECK"; then
          echo "::error title=quality-gate::Invalid check '${CHECK}'. Valid values: ${VALID}"
          exit 1
        fi

    # ── 1. Detect language ─────────────────────────────────────────────────────
    - name: Detect language
      id: lang
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f go.mod ]]; then
          echo "name=go" >> "$GITHUB_OUTPUT"
        elif [[ -f pyproject.toml || -f setup.py ]]; then
          echo "name=python" >> "$GITHUB_OUTPUT"
        elif [[ -f package.json && -f tsconfig.json ]]; then
          echo "name=typescript" >> "$GITHUB_OUTPUT"
        else
          echo "::error title=quality-gate::Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
          exit 1
        fi

    # ── 2. Go toolchain ────────────────────────────────────────────────────────
    - name: Set up Go
      if: steps.lang.outputs.name == 'go'
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
        cache: true

    # ══════════════════════════════════════════════════════════════════════════
    # app:format
    # ══════════════════════════════════════════════════════════════════════════

    - name: "format | install gofumpt + goimports"
      if: inputs.check == 'app:format' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail

        TOOL_BIN="$HOME/.quality-gate-tools/bin"
        TOOL_DL="$HOME/.quality-gate-tools/dl"
        mkdir -p "$TOOL_BIN" "$TOOL_DL"
        echo "$TOOL_BIN" >> "$GITHUB_PATH"

        # gofumpt v0.8.0 — static binary, sha256-verified
        GOFUMPT_OUT="$TOOL_DL/gofumpt"
        GOFUMPT_SHA="11604bbaf7321abcc2fca2c6a37b7e9198bb1e76e5a86f297c07201e8ab1fda9"
        if [[ ! -f "$GOFUMPT_OUT" ]] || ! echo "$GOFUMPT_SHA  $GOFUMPT_OUT" | sha256sum -c --status; then
          curl -sfL "https://github.com/mvdan/gofumpt/releases/download/v0.8.0/gofumpt_v0.8.0_linux_amd64" \
            -o "$GOFUMPT_OUT"
        fi
        echo "$GOFUMPT_SHA  $GOFUMPT_OUT" | sha256sum -c --status || {
          echo "::error title=format::sha256 mismatch for gofumpt"; rm -f "$GOFUMPT_OUT"; exit 1
        }
        install -m 0755 "$GOFUMPT_OUT" "$TOOL_BIN/gofumpt"

        # goimports v0.35.0 — installed via go install (module proxy guarantees integrity)
        GOBIN="$TOOL_BIN" go install golang.org/x/tools/cmd/goimports@v0.35.0

    - name: "format | gofumpt"
      if: inputs.check == 'app:format' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        UNFORMATTED=$(gofumpt -l .)
        if [[ -n "$UNFORMATTED" ]]; then
          echo "::error title=format::gofumpt found unformatted files. Run 'gofumpt -w .' locally."
          echo "$UNFORMATTED" | while read -r f; do echo "  $f"; done
          exit 1
        fi
        echo "gofumpt: all files are correctly formatted."

    - name: "format | goimports"
      if: inputs.check == 'app:format' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        UNFORMATTED=$(goimports -l .)
        if [[ -n "$UNFORMATTED" ]]; then
          echo "::error title=format::goimports found files with unorganised imports. Run 'goimports -w .' locally."
          echo "$UNFORMATTED" | while read -r f; do echo "  $f"; done
          exit 1
        fi
        echo "goimports: all import blocks are correctly organised."

    # ══════════════════════════════════════════════════════════════════════════
    # app:lint
    # ══════════════════════════════════════════════════════════════════════════

    - name: "lint | golangci-lint"
      if: inputs.check == 'app:lint' && steps.lang.outputs.name == 'go'
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        args: --config ${{ github.action_path }}/go/.golangci.yml

    # ══════════════════════════════════════════════════════════════════════════
    # app:strlint
    # ══════════════════════════════════════════════════════════════════════════

    - name: "strlint | install ast-grep"
      if: inputs.check == 'app:strlint' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail

        TOOL_BIN="$HOME/.quality-gate-tools/bin"
        TOOL_DL="$HOME/.quality-gate-tools/dl"
        mkdir -p "$TOOL_BIN" "$TOOL_DL"
        echo "$TOOL_BIN" >> "$GITHUB_PATH"

        # ast-grep 0.45.1 x86_64-unknown-linux-gnu, sha256-verified
        SG_OUT="$TOOL_DL/sg.zip"
        SG_SHA="76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63"
        if [[ ! -f "$SG_OUT" ]] || ! echo "$SG_SHA  $SG_OUT" | sha256sum -c --status; then
          curl -sfL \
            "https://github.com/ast-grep/ast-grep/releases/download/0.45.1/app-x86_64-unknown-linux-gnu.zip" \
            -o "$SG_OUT"
        fi
        echo "$SG_SHA  $SG_OUT" | sha256sum -c --status || {
          echo "::error title=strlint::sha256 mismatch for ast-grep"; rm -f "$SG_OUT"; exit 1
        }
        unzip -p "$SG_OUT" sg > "$TOOL_BIN/sg"
        chmod +x "$TOOL_BIN/sg"

    - name: "strlint | ast-grep org rules"
      if: inputs.check == 'app:strlint' && steps.lang.outputs.name == 'go'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # --config resolves ruleDirs relative to the config file's own location,
        # so this correctly points at $ACTION_PATH/go/rules/ regardless of cwd.
        sg scan --config "${ACTION_PATH}/go/sgconfig.yaml"
        echo "Org-wide ast-grep rules passed."

    - name: "strlint | ast-grep repo rules"
      if: inputs.check == 'app:strlint' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        # Run project-local rules only when the repo ships its own sgconfig.yaml
        # or rules/ directory. Org-wide rules already ran in the previous step.
        if [[ -f sgconfig.yaml || -d rules ]]; then
          sg scan
          echo "Repo-local ast-grep rules passed."
        else
          echo "No repo-local sgconfig.yaml or rules/ found — skipping."
        fi

    - name: "strlint | ast-grep rule tests"
      if: inputs.check == 'app:strlint' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d tests ]]; then
          sg test -t tests
          echo "Repo-local rule tests passed."
        else
          echo "No tests/ directory found — skipping rule tests."
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # app:typecheck
    # ══════════════════════════════════════════════════════════════════════════

    - name: "typecheck | go vet"
      if: inputs.check == 'app:typecheck' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        go vet ./...

    - name: "typecheck | go build"
      if: inputs.check == 'app:typecheck' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        # Build every package under cmd/ to verify the project compiles end-to-end.
        # Output is discarded (/dev/null); nothing is left on the runner.
        # Falls back to the module root when no cmd/ directory exists.
        if [[ -d cmd ]]; then
          go build -ldflags="-s -w" -o /dev/null ./cmd/...
        else
          go build -ldflags="-s -w" -o /dev/null .
        fi

    # ══════════════════════════════════════════════════════════════════════════
    # app:test
    # ══════════════════════════════════════════════════════════════════════════

    - name: "test | go test"
      if: inputs.check == 'app:test' && steps.lang.outputs.name == 'go'
      shell: bash
      run: |
        set -euo pipefail
        # -race requires CGO_ENABLED=1; the module-level default is 0 for
        # reproducible static builds so we set it explicitly here only.
        CGO_ENABLED=1 go test -count=1 -race -v ./...
