rules:
  - id: sf-remote-site-protocol-security-disabled
    message: >-
      Remote Site Setting com disableProtocolSecurity=true (permite HTTP em
      texto claro). Habilite a segurança de protocolo e use apenas https://.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.remoteSite-meta.xml"
    patterns:
      - pattern-regex: '<disableProtocolSecurity>true</disableProtocolSecurity>'
    metadata:
      category: security
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      confidence: HIGH

  - id: sf-named-credential-no-authentication
    message: >-
      Named Credential Anonymous/NoAuthentication: qualquer classe Apex chama o
      endpoint sem credencial nem principal por usuário (sem autorização nem
      auditoria). Use SecuredEndpoint com External Credential.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "*.namedCredential-meta.xml"
    patterns:
      - pattern-either:
          - pattern-regex: '<protocol>NoAuthentication</protocol>'
          - pattern-regex: '<principalType>Anonymous</principalType>'
    metadata:
      category: security
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      confidence: MEDIUM
      references:
        - "SECURITY_REVIEW addendum -> M3 (RioMCPStaging)"

  - id: sf-named-credential-merge-fields-enabled
    message: >-
      Named Credential com allowMergeFieldsInBody/Header=true: texto do
      cidadão contendo {!$Credential.*} seria interpolado com o segredo real e
      enviado ao endpoint remoto. Desabilite os merge fields.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "*.namedCredential-meta.xml"
    patterns:
      - pattern-regex: '<allowMergeFieldsIn(Body|Header)>true</allowMergeFieldsIn(Body|Header)>'
    metadata:
      category: security
      cwe: ["CWE-74: Injection"]
      confidence: MEDIUM
      references:
        - "SECURITY_REVIEW addendum -> M4 (MCPRioProd)"
