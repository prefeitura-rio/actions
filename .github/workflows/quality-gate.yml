name: Quality Gate

on:
  workflow_call:
    inputs:
      project-name:
        description: Stable project name shown in job names.
        type: string
        required: true
      working-directory:
        description: Project directory relative to the caller repository root.
        type: string
        required: true

permissions:
  contents: read

jobs:
  format:
    name: ${{ inputs.project-name }} / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@master
        with:
          check: app:format
          working-directory: ${{ inputs.working-directory }}

  lint:
    name: ${{ inputs.project-name }} / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@master
        with:
          check: app:lint
          working-directory: ${{ inputs.working-directory }}

  strlint:
    name: ${{ inputs.project-name }} / Structural Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@master
        with:
          check: app:strlint
          working-directory: ${{ inputs.working-directory }}

  typecheck:
    name: ${{ inputs.project-name }} / Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@master
        with:
          check: app:typecheck
          working-directory: ${{ inputs.working-directory }}

  test:
    name: ${{ inputs.project-name }} / Test
    needs: [format, lint, strlint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@master
        with:
          check: app:test
          working-directory: ${{ inputs.working-directory }}
