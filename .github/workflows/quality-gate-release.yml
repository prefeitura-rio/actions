name: Quality Gate Release

# ARCHIVED: the current Quality Gate is released from prefeitura-rio/flakes.
# Kept for historical compatibility; this workflow must not publish releases.
on:
  workflow_dispatch:

concurrency:
  group: quality-gate-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release-gate:
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
    steps:
      - name: Checkout release gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Check quality and security gates
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/check-workflow-gates.sh \
            --repository "$REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --required-workflow "Quality Gate Tests" \
            --required-workflow Security >> "$GITHUB_OUTPUT"

  release:
    needs: release-gate
    if: ${{ github.event_name == 'workflow_call' }}
    uses: ./.github/workflows/release.yml
    with:
      release_branch: master
      target_sha: ${{ github.event.workflow_run.head_sha }}
      toolkit_ref: ${{ github.event.workflow_run.head_sha }}
      initial_version: 1.0.0
      bump: minor
      floating_tag: quality-gate-latest
      tag_prefix: quality-gate-v
