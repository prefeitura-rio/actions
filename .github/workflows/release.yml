name: Generic Release Pipeline

on:
  workflow_call:
    inputs:
      release_branch:
        description: Branch whose current commit is eligible for release.
        required: true
        type: string
      target_sha:
        description: Commit SHA to tag and release.
        required: true
        type: string
      initial_version:
        description: First stable version when no matching version tag exists.
        required: false
        type: string
        default: "1.0.0"
      bump:
        description: Semantic version component to bump after the first release.
        required: false
        type: string
        default: patch
      floating_tag:
        description: Mutable tag that follows the latest stable release.
        required: false
        type: string
        default: latest
      tag_prefix:
        description: Prefix used for immutable version tags.
        required: false
        type: string
        default: v
      toolkit_repository:
        description: Repository containing the provider-neutral release scripts.
        required: false
        type: string
        default: prefeitura-rio/actions
      toolkit_ref:
        description: Full commit SHA of the release toolkit to use.
        required: true
        type: string
      require_workflow_gate:
        description: Require a successful workflow for the target commit before releasing.
        required: false
        type: boolean
        default: false
      required_workflow:
        description: Workflow name that must have succeeded for the target commit.
        required: false
        type: string
        default: ""
      git_author_name:
        description: Git author name for annotated release tags.
        required: false
        type: string
        default: CI Release Bot
      git_author_email:
        description: Git author email for annotated release tags.
        required: false
        type: string
        default: ci-release@example.invalid
    secrets:
      QUALITY_GATE_RELEASE_APP_ID:
        required: false
      QUALITY_GATE_RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      version:
        description: Stable version without the tag prefix.
        value: ${{ jobs.release.outputs.version }}
      version_tag:
        description: Immutable version tag created or reused by the release.
        value: ${{ jobs.release.outputs.version_tag }}
      floating_tag:
        description: Mutable tag updated by the release.
        value: ${{ jobs.release.outputs.floating_tag }}
      skipped:
        description: Whether the target was no longer the release branch tip.
        value: ${{ jobs.release.outputs.skipped }}

concurrency:
  group: generic-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-gate:
    if: ${{ inputs.require_workflow_gate }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
    steps:
      - name: Check required workflow
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
          REQUIRED_WORKFLOW: ${{ inputs.required_workflow }}
        run: |
          set -euo pipefail

          if [[ -z "$REQUIRED_WORKFLOW" ]]; then
            echo "required_workflow is required when require_workflow_gate is true." >&2
            exit 2
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA." >&2
            exit 1
          fi

          runs=$(gh api --method GET "repos/${REPOSITORY}/actions/runs" \
            -f "head_sha=${TARGET_SHA}" \
            -f 'event=push' \
            -f 'per_page=100')

          if jq -e --arg workflow "$REQUIRED_WORKFLOW" --arg sha "$TARGET_SHA" '
            any(.workflow_runs[];
              .name == $workflow and
              .head_sha == $sha and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )
          ' <<< "$runs" >/dev/null; then
            echo "Required workflow succeeded: $REQUIRED_WORKFLOW"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Required workflow missing or failed: $REQUIRED_WORKFLOW" >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: release-gate
    if: ${{ always() && (!inputs.require_workflow_gate || needs.release-gate.outputs.ready == 'true') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_ID: ${{ secrets.QUALITY_GATE_RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.QUALITY_GATE_RELEASE_APP_PRIVATE_KEY }}
    outputs:
      version: ${{ steps.calculate.outputs.version }}
      version_tag: ${{ steps.calculate.outputs.version_tag }}
      floating_tag: ${{ steps.publish.outputs.floating_tag }}
      skipped: ${{ steps.final-target.outputs.skip || steps.target.outputs.skip }}
    steps:
      - name: Checkout target commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Validate immutable toolkit ref
        shell: bash
        env:
          TOOLKIT_REF: ${{ inputs.toolkit_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TOOLKIT_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "toolkit_ref must be a full 40-character commit SHA." >&2
            exit 1
          fi

      - name: Checkout release toolkit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.toolkit_repository }}
          ref: ${{ inputs.toolkit_ref }}
          fetch-depth: 1
          path: release-toolkit
          persist-credentials: false

      - name: Create release App token
        if: ${{ env.RELEASE_APP_ID != '' && env.RELEASE_APP_PRIVATE_KEY != '' }}
        id: release-token
        uses: actions/create-github-app-token@0f859bf9e69e887678d5bbfbee594437cb440ffe # v2.1.0
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          owner: prefeitura-rio
          repositories: flakes

      - name: Authenticate the target remote
        shell: bash
        env:
          REPOSITORY: target
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          git -C "$REPOSITORY" remote set-url origin \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Validate release target
        id: target
        shell: bash
        env:
          REPOSITORY: target
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          bash release-toolkit/release/scripts/validate-target.sh \
            --repository "$REPOSITORY" \
            --release-branch "$RELEASE_BRANCH" \
            --target-sha "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Calculate stable version
        id: calculate
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          REPOSITORY: target
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          bash release-toolkit/release/scripts/calculate-version.sh \
            --repository "$REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --initial-version "$INITIAL_VERSION" \
            --bump "$BUMP" \
            --tag-prefix "$TAG_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Revalidate release target
        id: final-target
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          REPOSITORY: target
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          bash release-toolkit/release/scripts/validate-target.sh \
            --repository "$REPOSITORY" \
            --release-branch "$RELEASE_BRANCH" \
            --target-sha "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish version and floating tags
        id: publish
        if: steps.target.outputs.skip != 'true' && steps.final-target.outputs.skip != 'true'
        shell: bash
        env:
          FLOATING_TAG: ${{ inputs.floating_tag }}
          GIT_AUTHOR_EMAIL: ${{ inputs.git_author_email }}
          GIT_AUTHOR_NAME: ${{ inputs.git_author_name }}
          REPOSITORY: target
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VERSION_TAG: ${{ steps.calculate.outputs.version_tag }}
        run: |
          set -euo pipefail
          bash release-toolkit/release/scripts/publish-tags.sh \
            --repository "$REPOSITORY" \
            --release-branch "$RELEASE_BRANCH" \
            --target-sha "$TARGET_SHA" \
            --version-tag "$VERSION_TAG" \
            --floating-tag "$FLOATING_TAG" \
            --author-name "$GIT_AUTHOR_NAME" \
            --author-email "$GIT_AUTHOR_EMAIL" >> "$GITHUB_OUTPUT"
