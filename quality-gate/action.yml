name: Quality Gate
description: |
  Language-agnostic quality gate. Detects the project language and dispatches
  the requested check to the language-specific action.
inputs:
  check:
    description: |
      The quality check to run, in app:<job> form. Valid values:
      app:format | app:lint | app:strlint | app:typecheck | app:test | detect-only
    required: true
  working-directory:
    description: The directory to run quality-gate checks in.
    required: false
    default: .
  language:
    description: |
      Explicit language override (go, python, typescript).
      When provided, skips file-based detection and uses this value directly.
      When omitted, detection runs from marker files (go.mod, pyproject.toml,
      setup.py, package.json+tsconfig.json).
    required: false
outputs:
  error_message:
    description: Human-readable error message set when the action fails.
    value: ${{ steps.collect-error.outputs.error_message }}
  languages:
    description: |
      JSON array of detected languages, e.g. ["go","typescript"].
      Set only when check is detect-only. Empty for normal checks.
    value: ${{ steps.lang.outputs.languages }}
runs:
  using: composite
  steps:
    - name: Init error relay
      shell: bash
      run: |
        set -euo pipefail
        relay="$RUNNER_TEMP/quality-gate-error.txt"
        log="$RUNNER_TEMP/quality-gate-output.log"
        bash_env="$RUNNER_TEMP/quality-gate-bash-env"
        success="$RUNNER_TEMP/quality-gate-success"

        : > "$relay"
        : > "$log"
        rm -f "$success"
        cat > "$bash_env" <<'EOF'
        quality_gate_capture_failure() {
          local status=$?
          if [[ "$status" -ne 0 ]]; then
            {
              printf "Command failed (exit %s): %s\n\nRecent output:\n" "$status" "$BASH_COMMAND"
              sed -E $'s/\033\\[[0-9;]*[[:alpha:]]//g' "$RUNNER_TEMP/quality-gate-output.log" | tail -n 80 || true
            } > "$RUNNER_TEMP/quality-gate-error.txt"
          fi
          exit "$status"
        }
        exec > >(tee -a "$RUNNER_TEMP/quality-gate-output.log") 2>&1
        trap quality_gate_capture_failure ERR
        EOF
        echo "BASH_ENV=$bash_env" >> "$GITHUB_ENV"
    - name: Validate check input
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        VALID="app:format app:lint app:strlint app:typecheck app:test detect-only"
        if ! echo "$VALID" | grep -Fqw "$CHECK"; then
          MSG="Invalid check '${CHECK}'. Valid values: ${VALID}"
          echo "$MSG" > "$RUNNER_TEMP/quality-gate-error.txt"
          echo "::error title=quality-gate::${MSG}"
          exit 1
        fi
    - name: Detect language
      id: lang
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail

        # --- detect-only mode: output all languages as JSON array ---
        if [[ "$CHECK" == "detect-only" ]]; then
          detected=()
          if [[ -f go.mod ]]; then detected+=("go"); fi
          if [[ -f pyproject.toml || -f setup.py ]]; then detected+=("python"); fi
          if [[ -f package.json && -f tsconfig.json ]]; then detected+=("typescript"); fi

          if [[ ${#detected[@]} -eq 0 ]]; then
            MSG="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
            echo "$MSG" > "$RUNNER_TEMP/quality-gate-error.txt"
            echo "::error title=quality-gate::${MSG}"
            exit 1
          fi

          printf 'languages=%s\n' \
            "$(printf '%s\n' "${detected[@]}" | jq -R . | jq -sc .)" \
            >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # --- normal check mode ---
        detected=()
        if [[ -f go.mod ]]; then detected+=("go"); fi
        if [[ -f pyproject.toml || -f setup.py ]]; then detected+=("python"); fi
        if [[ -f package.json && -f tsconfig.json ]]; then detected+=("typescript"); fi

        if [[ -n "$LANGUAGE" ]]; then
          # Caller provided explicit language — validate against detected markers
          if [[ ! " ${detected[*]} " =~ " ${LANGUAGE} " ]]; then
            MSG="Requested language '${LANGUAGE}' not detected in project. Detected: ${detected[*]:-none}."
            echo "$MSG" > "$RUNNER_TEMP/quality-gate-error.txt"
            echo "::error title=quality-gate::${MSG}"
            exit 1
          fi
          echo "name=${LANGUAGE}" >> "$GITHUB_OUTPUT"
        else
          # Auto-detect: exactly one → use it; multiple → error with hint
          if [[ ${#detected[@]} -eq 0 ]]; then
            MSG="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
            echo "$MSG" > "$RUNNER_TEMP/quality-gate-error.txt"
            echo "::error title=quality-gate::${MSG}"
            exit 1
          elif [[ ${#detected[@]} -gt 1 ]]; then
            DETECTED="${detected[*]}"
            MSG="Multiple supported languages detected: ${DETECTED}. Run quality-gate once per language, or use the detect-only check to enumerate languages."
            echo "$MSG" > "$RUNNER_TEMP/quality-gate-error.txt"
            echo "::error title=quality-gate::${MSG}"
            exit 1
          fi
          echo "name=${detected[0]}" >> "$GITHUB_OUTPUT"
        fi
    - name: Run Go quality gate
      if: steps.lang.outputs.name == 'go'
      uses: $/quality-gate/go
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run Python quality gate
      if: steps.lang.outputs.name == 'python'
      uses: $/quality-gate/python
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run TypeScript quality gate
      if: steps.lang.outputs.name == 'typescript'
      uses: $/quality-gate/typescript
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Mark quality gate success
      shell: bash
      run: touch "$RUNNER_TEMP/quality-gate-success"
    - name: Collect error message
      id: collect-error
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        relay="$RUNNER_TEMP/quality-gate-error.txt"
        success="$RUNNER_TEMP/quality-gate-success"
        if [[ -s "$relay" ]]; then
          msg="$relay"
        elif [[ ! -f "$success" ]]; then
          printf "Quality gate '%s' failed. See the failed quality-gate step logs for details.\n" "${{ inputs.check }}" > "$relay"
          msg="$relay"
        else
          msg=""
        fi

        if [[ -n "$msg" ]]; then
          delimiter="QUALITY_GATE_ERROR_$(date +%s%N)"
          {
            echo "error_message<<$delimiter"
            cat "$msg"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        fi
        echo "BASH_ENV=" >> "$GITHUB_ENV"
    - name: Write quality gate summary
      if: always()
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
        ERROR_MESSAGE: ${{ steps.collect-error.outputs.error_message }}
      run: |
        set -euo pipefail
        success="$RUNNER_TEMP/quality-gate-success"
        {
          echo "### Quality Gate: $CHECK"
          if [[ -f "$success" ]]; then
            echo "Outcome: success"
          else
            echo "Outcome: failure"
          fi
          echo "Error:"
          if [[ -n "$ERROR_MESSAGE" ]]; then
            echo
            echo '<details>'
            echo '<summary>Failure details</summary>'
            echo
            echo '```text'
            printf '%s\n' "$ERROR_MESSAGE"
            echo '```'
            echo '</details>'
          else
            echo "None"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
