name: Quality Gate Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "quality-gate/**"
      - "release/**"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/quality-gate-tests.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/quality-gate-release.yml"
      - ".github/workflows/quality-gate-manual-release.yml"
      - ".github/scripts/**"
  push:
    branches: [master]
    paths:
      - "quality-gate/**"
      - "release/**"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/quality-gate-tests.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/quality-gate-release.yml"
      - ".github/workflows/quality-gate-manual-release.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: quality-gate-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable-workflow:
    uses: ./.github/workflows/quality-gate.yml
    with:
      project-name: reusable-workflow-smoke
      working-directory: quality-gate/go/fixtures/pass

  detect-summary:
    name: Detect summary / ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: single-language
            fixture: quality-gate/go/fixtures/pass
            expected_failure: false
          - case: multiple-languages
            fixture: quality-gate/fixtures/error/multiple-languages
            expected_failure: false
          - case: no-language
            fixture: quality-gate/fixtures/error/no-language
            expected_failure: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run detect-only action
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: ${{ matrix.fixture }}
          expected-failure: ${{ matrix.expected_failure }}
        continue-on-error: ${{ matrix.expected_failure }}
      - name: Assert action result and language output
        env:
          ACTION_OUTCOME: ${{ steps.detect.outcome }}
          EXPECTED_FAILURE: ${{ matrix.expected_failure }}
          LANGUAGES: ${{ steps.detect.outputs.languages }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_FAILURE" == true ]]; then
            [[ "$ACTION_OUTCOME" == failure ]] || {
              echo "::error::Expected detect-only action to fail but got $ACTION_OUTCOME"
              exit 1
            }
          else
            [[ "$ACTION_OUTCOME" == success ]] || {
              echo "::error::Expected detect-only action to succeed but got $ACTION_OUTCOME"
              exit 1
            }
          fi
          case "${{ matrix.case }}" in
            single-language)
              [[ "$LANGUAGES" == '["go"]' ]] || {
                echo "::error::Expected single-language output [\"go\"] but got $LANGUAGES"
                exit 1
              }
              ;;
            multiple-languages)
              [[ "$LANGUAGES" == '["go","python","typescript"]' ]] || {
                echo "::error::Expected multi-language output [\"go\",\"python\",\"typescript\"] but got $LANGUAGES"
                exit 1
              }
              ;;
            no-language)
              [[ -z "$LANGUAGES" ]] || {
                echo "::error::Expected no languages output but got $LANGUAGES"
                exit 1
              }
              ;;
          esac
      - name: Assert rendered summary payload
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          summary=$(<"$RUNNER_TEMP/quality-gate-summary.md")
          case "$CASE" in
            single-language)
              expected=$'### Quality Gate: Detect Language\nOutcome: success\nError: None\nLanguages Detected:\n- Go'
              [[ "$summary" == *"$expected"* ]] || {
                echo "::error::Unexpected single-language summary"
                printf '%s\n' "$summary"
                exit 1
              }
              ;;
            multiple-languages)
              expected=$'### Quality Gate: Detect Language\nOutcome: success\nError: None\nLanguages Detected:\n- Go\n- Python\n- TypeScript'
              [[ "$summary" == *"$expected"* ]] || {
                echo "::error::Unexpected multi-language summary"
                printf '%s\n' "$summary"
                exit 1
              }
              ;;
            no-language)
              expected=$'### Quality Gate: Detect Language\nOutcome: failure\nError: Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json.\nLanguages Detected: None'
              [[ "$summary" == *"$expected"* ]] || {
                echo "::error::Unexpected no-language summary"
                printf '%s\n' "$summary"
                exit 1
              }
              ;;
          esac
          [[ "$summary" != *"Quality Gate: detect-only"* ]] || {
            echo "::error::Summary still uses the old detect-only name"
            printf '%s\n' "$summary"
            exit 1
          }

  ast-grep-rules:
    name: ast-grep rules / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install ast-grep
        shell: bash
        run: |
          set -euo pipefail
          ast_grep_bin=$(bash quality-gate/scripts/install-ast-grep.sh)
          dirname "$ast_grep_bin" >> "$GITHUB_PATH"
      - name: Test ${{ matrix.language }} rules
        run: ast-grep test --skip-snapshot-tests --config quality-gate/${{ matrix.language }}/sgconfig.yaml

  portable-scripts:
    name: Portable quality-gate scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run provider-neutral script tests
        run: bash quality-gate/tests/scripts/test-portable.sh

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run version calculation tests
        run: bash release/tests/test-version.sh
      - name: Run tag publication tests
        run: bash release/tests/test-publish-tags.sh

  go:
    name: Go / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/format-fail
          - check: app:lint
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/lint-fail
          - check: app:strlint
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/typecheck-fail
          - check: app:test
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: go-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.go-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.go-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: go-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
          expected-failure: true
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.go-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert lint failure
        if: matrix.check == 'app:lint'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
          SUMMARY: ${{ steps.go-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"main.go"* ]] || {
            echo "::error::Expected golangci-lint to identify main.go in the failure output"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Expected the structured Go lint failure template"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Lint (Go)"* && "$SUMMARY" == *"Error:"* && "$SUMMARY" != *"Recent output:"* ]] || {
            echo "::error::Expected the rendered Go lint summary"
            exit 1
          }

      - name: assert strlint failure
        if: matrix.check == 'app:strlint'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"no-panic"* ]] || {
            echo "::error::Expected ast-grep to report no-panic rule violation"
            exit 1
          }

      - name: assert typecheck failure
        if: matrix.check == 'app:typecheck'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"undefined: undefinedVar"* ]] || {
            echo "::error::Expected go compiler to report undefined: undefinedVar"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"What was expected:"* ]] || {
            echo "::error::Expected the Go typecheck diagnostic template"
            exit 1
          }

      - name: assert test failure
        if: matrix.check == 'app:test'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"FAIL: TestFail"* || "$ERROR_MESSAGE" == *"got 1, want 2"* ]] || {
            echo "::error::Expected go test to report failing TestFail test"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
          SUMMARY: ${{ steps.go-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"gofumpt found unformatted files."* ]] || {
            echo "::error::Expected gofumpt details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" == *"How to fix it:"* ]] || {
            echo "::error::Expected the structured Go format failure template"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"gofumpt -w ."* ]] || {
            echo "::error::Expected gofumpt remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"Formatting diff:"* ]] || {
            echo "::error::Format summaries should not include the complete diff"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"main.go"* ]] || {
            echo "::error::Expected the unformatted Go file in the format failure"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Format (Go)"* && "$SUMMARY" == *"How to fix it:"* ]] || {
            echo "::error::Expected the rendered Go format summary"
            exit 1
          }
          [[ "$SUMMARY" != *"Formatting diff:"* && "$SUMMARY" != *"--- "* ]] || {
            echo "::error::Rendered Go format summary should not include a diff"
            exit 1
          }

      - name: assert friendly quality-gate summary output
        if: matrix.check == 'app:format'
        env:
          SUMMARY_NAME: ${{ steps.go-pass.outputs.summary_name }}
        run: |
          [[ "$SUMMARY_NAME" == "Format (Go)" ]] || {
            echo "::error::Expected the Go format output to use its friendly name"
            exit 1
          }

  python:
    name: Python / ${{ matrix.check }} / ${{ matrix.failure_kind || 'standard' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/format-fail
          - check: app:lint
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/lint-fail
            failure_kind: ruff
          - check: app:lint
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/complexity-fail
            failure_kind: complexipy
          - check: app:strlint
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/typecheck-fail
          - check: app:test
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: py-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.py-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.py-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: py-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
          expected-failure: true
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.py-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert ruff lint failure
        if: matrix.check == 'app:lint' && matrix.failure_kind == 'ruff'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
          SUMMARY: ${{ steps.py-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"F401"* || "$ERROR_MESSAGE" == *"os"* ]] || {
            echo "::error::Expected Ruff to report unused import violation"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Expected the structured Ruff lint failure template"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Lint (Python)"* && "$SUMMARY" == *"Error:"* && "$SUMMARY" != *"Recent output:"* ]] || {
            echo "::error::Expected the rendered Ruff lint summary"
            exit 1
          }

      - name: assert strlint failure
        if: matrix.check == 'app:strlint'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"no-eval"* ]] || {
            echo "::error::Expected ast-grep to report no-eval rule violation"
            exit 1
          }

      - name: assert pytest failure
        if: matrix.check == 'app:test'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"FAILED"* || "$ERROR_MESSAGE" == *"test_process_values"* ]] || {
            echo "::error::Expected pytest to report failing test_process_values"
            exit 1
          }

      - name: assert complexipy failure
        if: matrix.failure_kind == 'complexipy'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
          SUMMARY: ${{ steps.py-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"calculate_total"* ]] || {
            echo "::error::Expected the complexipy failure to identify calculate_total"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"FAILED"* ]] || {
            echo "::error::Expected complexipy to report the function as failed"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Expected the structured complexipy lint failure template"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Lint (Python)"* && "$SUMMARY" == *"Error:"* && "$SUMMARY" != *"Recent output:"* ]] || {
            echo "::error::Expected the rendered complexipy lint summary"
            exit 1
          }

      - name: assert basedpyright failure
        if: matrix.check == 'app:typecheck'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"__init__.py"* && "$ERROR_MESSAGE" == *"reportReturnType"* ]] || {
            echo "::error::Expected basedpyright to identify __init__.py with reportReturnType error"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"What was expected:"* ]] || {
            echo "::error::Expected the typecheck diagnostic template"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Typecheck error should not include recent output noise"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
          SUMMARY: ${{ steps.py-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"ruff format found formatting differences."* ]] || {
            echo "::error::Expected Ruff format details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" == *"How to fix it:"* ]] || {
            echo "::error::Expected the structured Ruff format failure template"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"uvx ruff@0.16.4 format ."* ]] || {
            echo "::error::Expected Ruff remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"Formatting diff:"* ]] || {
            echo "::error::Format summaries should not include the complete diff"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"src/app/__init__.py"* ]] || {
            echo "::error::Expected the unformatted Python file in the format failure"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Format (Python)"* && "$SUMMARY" == *"How to fix it:"* ]] || {
            echo "::error::Expected the rendered Python format summary"
            exit 1
          }
          [[ "$SUMMARY" != *"Formatting diff:"* && "$SUMMARY" != *"--- "* ]] || {
            echo "::error::Rendered Python format summary should not include a diff"
            exit 1
          }

      - name: assert friendly quality-gate summary output
        if: matrix.check == 'app:format'
        env:
          SUMMARY_NAME: ${{ steps.py-pass.outputs.summary_name }}
        run: |
          [[ "$SUMMARY_NAME" == "Format (Python)" ]] || {
            echo "::error::Expected the Python format output to use its friendly name"
            exit 1
          }

  python-coverage:
    name: Python / coverage / ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: default-threshold
            fixture: quality-gate/python/fixtures/coverage-default-fail
            expected_failure: true
            expected_message: "Required test coverage of 80% not reached"
            coverage_rcfile: ""
          - case: pyproject-override
            fixture: quality-gate/python/fixtures/coverage-pyproject-override
            expected_failure: false
            coverage_rcfile: ""
          - case: coveragerc-auto-detect
            fixture: quality-gate/python/fixtures/coverage-config-overrides
            expected_failure: true
            expected_message: "Required test coverage of 100"
            coverage_rcfile: ""
          - case: coveragerc-toml-override
            fixture: quality-gate/python/fixtures/coverage-config-overrides
            expected_failure: false
            coverage_rcfile: .coveragerc.toml
          - case: coverage-ini-override
            fixture: quality-gate/python/fixtures/coverage-config-overrides
            expected_failure: false
            coverage_rcfile: coverage.ini
          - case: setup-cfg-override
            fixture: quality-gate/python/fixtures/coverage-config-overrides
            expected_failure: false
            coverage_rcfile: setup.cfg
          - case: tox-ini-override
            fixture: quality-gate/python/fixtures/coverage-config-overrides
            expected_failure: false
            coverage_rcfile: tox.ini
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run coverage policy
        id: coverage
        uses: ./quality-gate
        env:
          COVERAGE_RCFILE: ${{ matrix.coverage_rcfile }}
        with:
          check: app:test
          working-directory: ${{ matrix.fixture }}
          expected-failure: ${{ matrix.expected_failure }}
        continue-on-error: ${{ matrix.expected_failure }}

      - name: Assert coverage policy
        env:
          ERROR_MESSAGE: ${{ steps.coverage.outputs.error_message }}
          EXPECTED_FAILURE: ${{ matrix.expected_failure }}
          EXPECTED_MESSAGE: ${{ matrix.expected_message }}
        run: |
          if [[ "$EXPECTED_FAILURE" == true ]]; then
            [[ "${{ steps.coverage.outcome }}" == "failure" ]] || {
              echo "::error::Expected the coverage policy to fail on ${{ matrix.fixture }}"
              exit 1
            }
            [[ "$ERROR_MESSAGE" == *"$EXPECTED_MESSAGE"* ]] || {
              echo "::error::Expected coverage diagnostic '$EXPECTED_MESSAGE'"
              exit 1
            }
          else
            [[ "${{ steps.coverage.outcome }}" == "success" ]] || {
              echo "::error::Expected the local coverage override to pass on ${{ matrix.fixture }}"
              exit 1
            }
          fi

  typescript:
    name: TypeScript / ${{ matrix.framework == 'typescript' && 'plain' || matrix.framework }} / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: typescript
            check: app:format
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/format-fail
          - framework: typescript
            check: app:lint
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/lint-fail
          - framework: typescript
            check: app:strlint
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/strlint-fail
          - framework: typescript
            check: app:typecheck
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/typecheck-fail
          - framework: typescript
            check: app:test
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/test-fail
          - framework: vue
            check: app:format
            fixture: quality-gate/typescript/fixtures/vue/pass
            fail: quality-gate/typescript/fixtures/vue/format-fail
          - framework: vue
            check: app:lint
            fixture: quality-gate/typescript/fixtures/vue/pass
            fail: quality-gate/typescript/fixtures/vue/lint-fail
          - framework: vue
            check: app:strlint
            fixture: quality-gate/typescript/fixtures/vue/pass
            fail: quality-gate/typescript/fixtures/vue/strlint-fail
          - framework: vue
            check: app:typecheck
            fixture: quality-gate/typescript/fixtures/vue/pass
            fail: quality-gate/typescript/fixtures/vue/typecheck-fail
          - framework: vue
            check: app:test
            fixture: quality-gate/typescript/fixtures/vue/pass
            fail: quality-gate/typescript/fixtures/vue/test-fail
          - framework: nuxt
            check: app:format
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            fail: quality-gate/typescript/fixtures/nuxt/format-fail
          - framework: nuxt
            check: app:lint
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            fail: quality-gate/typescript/fixtures/nuxt/lint-fail
          - framework: nuxt
            check: app:strlint
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            fail: quality-gate/typescript/fixtures/nuxt/strlint-fail
          - framework: nuxt
            check: app:typecheck
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            fail: quality-gate/typescript/fixtures/nuxt/typecheck-fail
          - framework: nuxt
            check: app:test
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            fail: quality-gate/typescript/fixtures/nuxt/test-fail
          - framework: next
            check: app:format
            fixture: quality-gate/typescript/fixtures/next/pass
            fail: quality-gate/typescript/fixtures/next/format-fail
          - framework: next
            check: app:lint
            fixture: quality-gate/typescript/fixtures/next/pass
            fail: quality-gate/typescript/fixtures/next/lint-fail
          - framework: next
            check: app:strlint
            fixture: quality-gate/typescript/fixtures/next/pass
            fail: quality-gate/typescript/fixtures/next/strlint-fail
          - framework: next
            check: app:typecheck
            fixture: quality-gate/typescript/fixtures/next/pass
            fail: quality-gate/typescript/fixtures/next/typecheck-fail
          - framework: next
            check: app:test
            fixture: quality-gate/typescript/fixtures/next/pass
            fail: quality-gate/typescript/fixtures/next/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: ts-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.ts-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.ts-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: ts-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
          expected-failure: true
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.ts-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert lint failure
        if: matrix.check == 'app:lint' && matrix.framework != 'next'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
          SUMMARY: ${{ steps.ts-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"no-var"* || "$ERROR_MESSAGE" == *"react-doctor"* || "$ERROR_MESSAGE" == *"oxlint"* || "$ERROR_MESSAGE" == *"var "* ]] || {
            echo "::error::Expected oxlint to report lint violation"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Expected the structured TypeScript lint failure template"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Lint (Typescript"* && "$SUMMARY" == *"Error:"* && "$SUMMARY" != *"Recent output:"* ]] || {
            echo "::error::Expected the rendered TypeScript lint summary"
            exit 1
          }

      - name: assert Next.js lint failure
        if: matrix.framework == 'next' && matrix.check == 'app:lint'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
          SUMMARY: ${{ steps.ts-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"no-img-element"* ]] || {
            echo "::error::Expected the Oxlint Next.js plugin to report no-img-element"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"Recent output:"* ]] || {
            echo "::error::Expected the structured Next.js lint failure template"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Lint (Typescript - Next.js)"* && "$SUMMARY" == *"Error:"* && "$SUMMARY" != *"Recent output:"* ]] || {
            echo "::error::Expected the rendered Next.js lint summary"
            exit 1
          }

      - name: assert strlint failure
        if: matrix.check == 'app:strlint'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"no-any-assertion"* || "$ERROR_MESSAGE" == *"no-console"* ]] || {
            echo "::error::Expected ast-grep to report structural lint violation"
            exit 1
          }

      - name: assert typecheck failure
        if: matrix.check == 'app:typecheck'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"error TS2322"* ]] || {
            echo "::error::Expected TypeScript compiler to report error TS2322 (type mismatch)"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" != *"What was expected:"* && "$ERROR_MESSAGE" != *"See the typecheck diagnostics"* ]] || {
            echo "::error::Expected the TypeScript typecheck diagnostic template"
            exit 1
          }

      - name: assert test failure
        if: matrix.check == 'app:test'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"FAIL"* || "$ERROR_MESSAGE" == *"AssertionError"* || "$ERROR_MESSAGE" == *"expected"* ]] || {
            echo "::error::Expected test runner to report failing test"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
          EXPECTED_FILE: ${{ matrix.framework == 'typescript' && 'src/app.ts' || matrix.framework == 'vue' && 'src/App.vue' || matrix.framework == 'next' && 'app/page.tsx' || 'nuxt.config.ts' }}
          SUMMARY: ${{ steps.ts-fail.outputs.summary }}
        run: |
          [[ "$ERROR_MESSAGE" == *"oxfmt found formatting differences in"* ]] || {
            echo "::error::Expected Oxfmt details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Error:"* && "$ERROR_MESSAGE" == *"How to fix it:"* ]] || {
            echo "::error::Expected the structured Oxfmt format failure template"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"npx --yes --loglevel=error oxfmt@0.66.0 --write ."* ]] || {
            echo "::error::Expected Oxfmt remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"Formatting diff:"* ]] || {
            echo "::error::Format summaries should not include the complete diff"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"$EXPECTED_FILE"* ]] || {
            echo "::error::Expected the unformatted $EXPECTED_FILE file in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"Command failed (exit 1): FILES="* ]] || {
            echo "::error::Expected the custom Oxfmt report to survive the error trap"
            exit 1
          }
          [[ "$SUMMARY" == *"### Quality Gate: Format (Typescript"* && "$SUMMARY" == *"How to fix it:"* ]] || {
            echo "::error::Expected the rendered TypeScript format summary"
            exit 1
          }
          [[ "$SUMMARY" != *"Formatting diff:"* && "$SUMMARY" != *"--- "* ]] || {
            echo "::error::Rendered TypeScript format summary should not include a diff"
            exit 1
          }

      - name: assert friendly quality-gate summary output
        if: matrix.check == 'app:format'
        env:
          SUMMARY_NAME: ${{ steps.ts-pass.outputs.summary_name }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          case "$FRAMEWORK" in
            vue) EXPECTED_SUMMARY="Format (Typescript - Vue)" ;;
            nuxt) EXPECTED_SUMMARY="Format (Typescript - Nuxt)" ;;
            next) EXPECTED_SUMMARY="Format (Typescript - Next.js)" ;;
            *) EXPECTED_SUMMARY="Format (Typescript)" ;;
          esac
          [[ "$SUMMARY_NAME" == "$EXPECTED_SUMMARY" ]] || {
            echo "::error::Expected '$EXPECTED_SUMMARY' but got '$SUMMARY_NAME'"
            exit 1
          }

  error-invalid-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - "app:invalid"
          - "app.format"
          - "app:forma."
          - "app:[f]ormat"
          - "app:detect"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run with invalid check
        id: bad-check
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          expected-failure: true
        continue-on-error: true
      - name: assert invalid check was rejected
        run: |
          [[ "${{ steps.bad-check.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on invalid check but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.bad-check.outputs.error_message }}"
          EXPECTED="Invalid check '${{ matrix.check }}'. Valid values: app:format app:lint app:strlint app:typecheck app:test detect-only"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  setup-py-success:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run format on setup.py-only project
        id: setup-py
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/setup-py-only
      - name: assert setup.py project was accepted
        run: |
          [[ "${{ steps.setup-py.outcome }}" == "success" ]] || {
            echo "::error::Expected success on setup.py-only project but got ${{ steps.setup-py.outcome }}"
            exit 1
          }

  detect-single-language:
    name: detect-single / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            fixture: quality-gate/go/fixtures/pass
            expected: '["go"]'
          - language: python
            fixture: quality-gate/python/fixtures/pass
            expected: '["python"]'
          - language: typescript
            fixture: quality-gate/typescript/fixtures/pass
            expected: '["typescript"]'
          - language: typescript
            framework: vue
            fixture: quality-gate/typescript/fixtures/vue/pass
            expected: '["typescript"]'
          - language: typescript
            framework: nuxt
            fixture: quality-gate/typescript/fixtures/nuxt/pass
            expected: '["typescript"]'
          - language: typescript
            framework: next
            fixture: quality-gate/typescript/fixtures/next/pass
            expected: '["typescript"]'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect ${{ matrix.language }} project
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: ${{ matrix.fixture }}
      - name: assert single language detected
        run: |
          LANGS='${{ steps.detect.outputs.languages }}'
          EXPECTED='${{ matrix.expected }}'
          [[ "$LANGS" == "$EXPECTED" ]] || {
            echo "::error::Expected '${EXPECTED}' — Got '${LANGS}'"
            exit 1
          }

  detect-multi-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect multi-language directory
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: quality-gate/fixtures/error/multiple-languages
      - name: assert multiple languages detected
        run: |
          LANGS='${{ steps.detect.outputs.languages }}'
          # jq sort to normalize order
          ACTUAL=$(echo "$LANGS" | jq -S .)
          EXPECTED=$(echo '["go","python","typescript"]' | jq -S .)
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Expected '${EXPECTED}' — Got '${ACTUAL}'"
            exit 1
          }

  detect-no-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect empty directory
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: quality-gate/fixtures/error/no-language
          expected-failure: true
        continue-on-error: true
      - name: assert no-language error
        run: |
          [[ "${{ steps.detect.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on empty directory but it succeeded"
            exit 1
          }

  language-override-rejected:
    name: language-override-rejected / ${{ matrix.language }}-on-${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            project: go
            fixture: quality-gate/go/fixtures/pass
          - language: typescript
            project: go
            fixture: quality-gate/go/fixtures/pass
          - language: go
            project: python
            fixture: quality-gate/python/fixtures/pass
          - language: typescript
            project: python
            fixture: quality-gate/python/fixtures/pass
          - language: go
            project: typescript
            fixture: quality-gate/typescript/fixtures/pass
          - language: python
            project: typescript
            fixture: quality-gate/typescript/fixtures/pass
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: request ${{ matrix.language }} on ${{ matrix.project }} project
        id: override
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: ${{ matrix.fixture }}
          language: ${{ matrix.language }}
          expected-failure: true
        continue-on-error: true
      - name: assert override was rejected
        env:
          ERROR_MESSAGE: ${{ steps.override.outputs.error_message }}
        run: |
          [[ "${{ steps.override.outcome }}" == "failure" ]] || {
            echo "::error::Expected failure when requesting ${{ matrix.language }} on ${{ matrix.project }} project"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Requested language '${{ matrix.language }}' not detected in project."* ]] || {
            echo "::error::Expected rejection diagnostic for ${{ matrix.language }} on ${{ matrix.project }}"
            exit 1
          }

  language-override-accepted:
    name: language-override-accepted / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            fixture: quality-gate/go/fixtures/pass
          - language: python
            fixture: quality-gate/python/fixtures/pass
          - language: typescript
            fixture: quality-gate/typescript/fixtures/pass
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: request ${{ matrix.language }} on ${{ matrix.language }} project
        id: override
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: ${{ matrix.fixture }}
          language: ${{ matrix.language }}
      - name: assert override succeeded
        run: |
          [[ "${{ steps.override.outcome }}" == "success" ]] || {
