name: Quality Gate Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "quality-gate/**"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/quality-gate-tests.yml"
  push:
    branches: [master]
    paths:
      - "quality-gate/**"
      - ".github/workflows/quality-gate.yml"
      - ".github/workflows/quality-gate-tests.yml"
  workflow_dispatch:

concurrency:
  group: quality-gate-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable-workflow:
    uses: ./.github/workflows/quality-gate.yml
    with:
      project-name: reusable-workflow-smoke
      working-directory: quality-gate/go/fixtures/pass

  ast-grep-rules:
    name: ast-grep rules / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install ast-grep
        shell: bash
        run: |
          set -euo pipefail
          TOOL_BIN="$HOME/.ast-grep/bin"
          TOOL_DL="$HOME/.ast-grep/dl"
          mkdir -p "$TOOL_BIN" "$TOOL_DL"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"
          SG_OUT="$TOOL_DL/sg.zip"
          SG_SHA="76fb6555be6734fb5057dba8d2fb756430f374bb9e1af694cf1ce00e13238d63"
          if [[ ! -f "$SG_OUT" ]] || ! echo "$SG_SHA  $SG_OUT" | sha256sum -c --status; then
            curl -sfL \
              "https://github.com/ast-grep/ast-grep/releases/download/0.45.1/app-x86_64-unknown-linux-gnu.zip" \
              -o "$SG_OUT"
          fi
          echo "$SG_SHA  $SG_OUT" | sha256sum -c --status || {
            echo "::error title=strlint::sha256 mismatch for ast-grep"
            rm -f "$SG_OUT"
            exit 1
          }
          unzip -p "$SG_OUT" ast-grep > "$TOOL_BIN/ast-grep"
          chmod +x "$TOOL_BIN/ast-grep"
      - name: Test ${{ matrix.language }} rules
        run: ast-grep test --skip-snapshot-tests --config quality-gate/${{ matrix.language }}/sgconfig.yaml

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/format-fail
          - check: app:lint
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/lint-fail
          - check: app:strlint
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/typecheck-fail
          - check: app:test
            fixture: quality-gate/go/fixtures/pass
            fail: quality-gate/go/fixtures/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: go-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.go-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.go-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: go-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.go-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.go-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"gofumpt found unformatted files."* ]] || {
            echo "::error::Expected gofumpt details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Formatting diff:"* ]] || {
            echo "::error::Expected a gofumpt formatting diff in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Fix locally with: gofumpt -w ."* ]] || {
            echo "::error::Expected gofumpt remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"main.go"* ]] || {
            echo "::error::Expected the unformatted Go file in the format failure"
            exit 1
          }
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:test]
        include:
          - check: app:format
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/format-fail
          - check: app:lint
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/lint-fail
          - check: app:strlint
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/strlint-fail
          - check: app:test
            fixture: quality-gate/python/fixtures/pass
            fail: quality-gate/python/fixtures/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: py-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.py-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.py-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: py-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.py-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.py-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"ruff format found formatting differences."* ]] || {
            echo "::error::Expected Ruff format details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Formatting diff:"* ]] || {
            echo "::error::Expected a Ruff formatting diff in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Fix locally with: uvx ruff@latest format ."* ]] || {
            echo "::error::Expected Ruff remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"src/app/__init__.py"* ]] || {
            echo "::error::Expected the unformatted Python file in the format failure"
            exit 1
          }
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/format-fail
          - check: app:lint
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/lint-fail
          - check: app:strlint
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/typecheck-fail
          - check: app:test
            fixture: quality-gate/typescript/fixtures/pass
            fail: quality-gate/typescript/fixtures/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: ts-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.ts-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.ts-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: ts-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "${{ steps.ts-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }
          [[ -n "$ERROR_MESSAGE" ]] || {
            echo "::error::Expected a diagnostic error message for ${{ matrix.fail }}"
            exit 1
          }

      - name: assert format failure is actionable
        if: matrix.check == 'app:format'
        env:
          ERROR_MESSAGE: ${{ steps.ts-fail.outputs.error_message }}
        run: |
          [[ "$ERROR_MESSAGE" == *"oxfmt found formatting differences."* ]] || {
            echo "::error::Expected Oxfmt details in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Formatting diff:"* ]] || {
            echo "::error::Expected an Oxfmt formatting diff in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"Fix locally with: npx --yes oxfmt@0.62.0 --write ."* ]] || {
            echo "::error::Expected Oxfmt remediation command in the format failure"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"src/app.ts"* ]] || {
            echo "::error::Expected the unformatted TypeScript file in the format failure"
            exit 1
          }
  error-invalid-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - "app:invalid"
          - "app.format"
          - "app:forma."
          - "app:[f]ormat"
          - "app:detect"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run with invalid check
        id: bad-check
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
        continue-on-error: true
      - name: assert invalid check was rejected
        run: |
          [[ "${{ steps.bad-check.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on invalid check but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.bad-check.outputs.error_message }}"
          EXPECTED="Invalid check '${{ matrix.check }}'. Valid values: app:format app:lint app:strlint app:typecheck app:test detect-only"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  setup-py-success:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run format on setup.py-only project
        id: setup-py
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/setup-py-only
      - name: assert setup.py project was accepted
        run: |
          [[ "${{ steps.setup-py.outcome }}" == "success" ]] || {
            echo "::error::Expected success on setup.py-only project but got ${{ steps.setup-py.outcome }}"
            exit 1
          }

  detect-single-language:
    name: detect-single / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            fixture: quality-gate/go/fixtures/pass
            expected: '["go"]'
          - language: python
            fixture: quality-gate/python/fixtures/pass
            expected: '["python"]'
          - language: typescript
            fixture: quality-gate/typescript/fixtures/pass
            expected: '["typescript"]'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect ${{ matrix.language }} project
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: ${{ matrix.fixture }}
      - name: assert single language detected
        run: |
          LANGS='${{ steps.detect.outputs.languages }}'
          EXPECTED='${{ matrix.expected }}'
          [[ "$LANGS" == "$EXPECTED" ]] || {
            echo "::error::Expected '${EXPECTED}' — Got '${LANGS}'"
            exit 1
          }

  detect-multi-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect multi-language directory
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: quality-gate/fixtures/error/multiple-languages
      - name: assert multiple languages detected
        run: |
          LANGS='${{ steps.detect.outputs.languages }}'
          # jq sort to normalize order
          ACTUAL=$(echo "$LANGS" | jq -S .)
          EXPECTED=$(echo '["go","python","typescript"]' | jq -S .)
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Expected '${EXPECTED}' — Got '${ACTUAL}'"
            exit 1
          }

  detect-no-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: detect empty directory
        id: detect
        uses: ./quality-gate
        with:
          check: detect-only
          working-directory: quality-gate/fixtures/error/no-language
        continue-on-error: true
      - name: assert no-language error
        run: |
          [[ "${{ steps.detect.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on empty directory but it succeeded"
            exit 1
          }

  language-override-rejected:
    name: language-override-rejected / ${{ matrix.language }}-on-${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            project: go
            fixture: quality-gate/go/fixtures/pass
          - language: typescript
            project: go
            fixture: quality-gate/go/fixtures/pass
          - language: go
            project: python
            fixture: quality-gate/python/fixtures/pass
          - language: typescript
            project: python
            fixture: quality-gate/python/fixtures/pass
          - language: go
            project: typescript
            fixture: quality-gate/typescript/fixtures/pass
          - language: python
            project: typescript
            fixture: quality-gate/typescript/fixtures/pass
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: request ${{ matrix.language }} on ${{ matrix.project }} project
        id: override
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: ${{ matrix.fixture }}
          language: ${{ matrix.language }}
        continue-on-error: true
      - name: assert override was rejected
        run: |
          [[ "${{ steps.override.outcome }}" == "failure" ]] || {
            echo "::error::Expected failure when requesting ${{ matrix.language }} on ${{ matrix.project }} project"
            exit 1
          }

  language-override-accepted:
    name: language-override-accepted / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            fixture: quality-gate/go/fixtures/pass
          - language: python
            fixture: quality-gate/python/fixtures/pass
          - language: typescript
            fixture: quality-gate/typescript/fixtures/pass
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: request ${{ matrix.language }} on ${{ matrix.language }} project
        id: override
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: ${{ matrix.fixture }}
          language: ${{ matrix.language }}
      - name: assert override succeeded
        run: |
          [[ "${{ steps.override.outcome }}" == "success" ]] || {
            echo "::error::Expected success when requesting ${{ matrix.language }} on ${{ matrix.language }} project"
            exit 1
          }

  repo-local-rules:
    name: repo-local rules / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run repository-local rule fixture
        id: repo-rule
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/fixtures/${{ matrix.language }}/repo-rule-fail
        continue-on-error: true
      - name: assert repository-local violation failed
        run: |
          [[ "${{ steps.repo-rule.outcome }}" == "failure" ]] || {
            echo "::error::Expected repository-local ${{ matrix.language }} rule to fail"
            exit 1
          }

  mandatory-policy-rules:
    name: mandatory policy / ${{ matrix.rule }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            rule: no-plain-error-wrap
          - language: go
            rule: no-http-default-client
          - language: python
            rule: no-print
          - language: python
            rule: no-bare-except
          - language: typescript
            rule: no-console
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run mandatory policy fixture
        id: policy-rule
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/fixtures/${{ matrix.language }}/policy-fail/${{ matrix.rule }}
        continue-on-error: true
      - name: assert mandatory policy failed
        run: |
          [[ "${{ steps.policy-rule.outcome }}" == "failure" ]] || {
            echo "::error::Expected mandatory policy ${{ matrix.rule }} to fail"
            exit 1
          }

  polyglot-project-paths:
    name: polyglot / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: admin-application
            path: quality-gate/fixtures/polyglot/applications/admin
          - project: payments-service
            path: quality-gate/fixtures/polyglot/services/payments
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run project-specific quality gate
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: ${{ matrix.path }}

  error-no-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run against empty directory
        id: no-lang
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/no-language
        continue-on-error: true
      - name: assert no-language error
        run: |
          [[ "${{ steps.no-lang.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on empty directory but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-lang.outputs.error_message }}"
          EXPECTED="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-ts-no-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run typecheck on TS project without lockfile
        id: no-lockfile
        uses: ./quality-gate
        with:
          check: app:typecheck
          working-directory: quality-gate/fixtures/error/ts-no-lockfile
        continue-on-error: true
      - name: assert lockfile error
        run: |
          [[ "${{ steps.no-lockfile.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on missing lockfile but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-lockfile.outputs.error_message }}"
          EXPECTED="No lockfile found for TypeScript project. Commit pnpm-lock.yaml (pnpm) or package-lock.json (npm)."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-ts-no-tsconfig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run format on package.json without tsconfig.json
        id: no-tsconfig
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/ts-no-tsconfig
        continue-on-error: true
      - name: assert no-language error (not TypeScript)
        run: |
          [[ "${{ steps.no-tsconfig.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail when tsconfig.json is missing but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-tsconfig.outputs.error_message }}"
          EXPECTED="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-gofumpt-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          # shellcheck disable=SC2016
          printf '#!/usr/bin/env bash\necho "corrupted" > "${@: -1}"\n' \
            > "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run format on go project with corrupted download
        id: gofumpt-mismatch
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/go/fixtures/pass
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        run: |
          [[ "${{ steps.gofumpt-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on gofumpt sha mismatch but it succeeded"
            exit 1
          }
          ACTUAL="${{ steps.gofumpt-mismatch.outputs.error_message }}"
          EXPECTED="sha256 mismatch for gofumpt"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/gofumpt" ]] || {
            echo "::error::Corrupted gofumpt binary was not deleted after sha mismatch"
            exit 1
          }

  error-ast-grep-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          # shellcheck disable=SC2016
          printf '#!/usr/bin/env bash\necho "corrupted" > "${@: -1}"\n' \
            > "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run strlint on go project with corrupted download
        id: astgrep-mismatch
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/go/fixtures/pass
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        run: |
          [[ "${{ steps.astgrep-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ast-grep sha mismatch but it succeeded"
            exit 1
          }
          ACTUAL="${{ steps.astgrep-mismatch.outputs.error_message }}"
          EXPECTED="sha256 mismatch for ast-grep"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/sg.zip" ]] || {
            echo "::error::Corrupted ast-grep archive was not deleted after sha mismatch"
            exit 1
          }
