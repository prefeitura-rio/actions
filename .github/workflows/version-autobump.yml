name: Calculate version and diff guard

on:
  workflow_call:
    inputs:
      context:
        description: "Path which will be checked for changes"
        required: false
        type: string
        default: "."
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu_latest"
    outputs:
      tag:
        description: "Calculated semantic tag (e.g. v1.0.1 or v1.0.1-rc.12)"
        value: ${{ jobs.calculate.outputs.tag }}
      skip:
        description: "Whether build should be skipped (no changes since last tag)"
        value: ${{ jobs.calculate.outputs.skip }}

jobs:
  calculate:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          BRANCH="${GITHUB_REF_NAME}"

          if [ -z "$LATEST_TAG" ]; then
            echo "First release: setting version to v1.0.0"
            HAS_TAG="false"
            NEXT_VERSION="v1.0.0"
          else
            HAS_TAG="true"
            CLEAN_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)

            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          if [ "$BRANCH" == "main" ]; then
            TAG="v$NEXT_VERSION"
          else
            TAG="v$NEXT_VERSION-rc.${{ github.run_number }}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "has_tag=$HAS_TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if no changes were made since last release
        id: guard
        shell: bash
        run: |
          if [ "${{ steps.version.outputs.has_tag }}" == "true" ] && [ "${GITHUB_REF_NAME}" == "main" ]; then
            LAST_TAG="${{ steps.version.outputs.latest_tag }}"

            if ! git diff --name-only "$LAST_TAG" HEAD -- "${{ inputs.context }}" | grep -q .; then
              echo "No changes in ${{ inputs.context }} since $LAST_TAG -- skipping build."
              echo "skip=true" >> "GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
