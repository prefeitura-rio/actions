rules:
  - id: apex-hardcoded-webhook-secret
    message: >-
      Segredo embutido no código: URL de webhook (Discord/Slack) com token
      hardcoded em Apex. Um webhook é uma credencial bearer — qualquer pessoa
      com acesso ao repositório pode enviar/forjar mensagens. Rotacione o token
      e mova para Custom Metadata protegido ou Named Credential.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.cls"
        - "*.trigger"
    patterns:
      - pattern-regex: 'https://(discord(app)?\.com/api/webhooks|hooks\.slack\.com/services|[a-z0-9.\-]+\.webhook\.office\.com)/[A-Za-z0-9._/\-]{12,}'
    metadata:
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      references:
        - "SECURITY_REVIEW.md -> H-01 (LogEventDiscordAlert.cls)"
