rules:
  - id: sfmc-untrusted-ephemeral-endpoint
    message: >-
      Journey/asset SFMC de produção aponta para endpoint efêmero/não confiável
      (trycloudflare, ngrok, webhook.site, jsonplaceholder, localhost). Esses
      hostnames são reatribuíveis a terceiros e recebem dados do cidadão.
      Hospede a custom activity em domínio próprio da prefeitura com TLS.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.journey-meta.json"
        - "*.asset-asset-meta.json"
        - "*.asset-asset-meta.html"
    patterns:
      - pattern-regex: 'https?://[^"''\s]*(trycloudflare\.com|ngrok-free\.(dev|app)|ngrok\.(io|app)|webhook\.site|jsonplaceholder\.typicode\.com)|https?://localhost[:/]'
    metadata:
      category: security
      cwe: ["CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: HIGH
      references:
        - "SECURITY_REVIEW addendum (SFMC) -> C1/C2"

  - id: sfmc-custom-activity-jwt-disabled
    message: >-
      Custom activity de Journey Builder com useJwt:false. SFMC não assina o
      request (o receptor não distingue tráfego legítimo) e os endpoints
      execute/save/publish/stop aceitam POST anônimo. Habilite JWT e valide-o.
    severity: WARNING
    languages: [generic]
    paths:
      include:
        - "*.journey-meta.json"
    patterns:
      - pattern-regex: '"useJwt"\s*:\s*false'
    metadata:
      category: security
      cwe: ["CWE-306: Missing Authentication for Critical Function"]
      confidence: MEDIUM
      references:
        - "SECURITY_REVIEW addendum (SFMC) -> C1/C2"
