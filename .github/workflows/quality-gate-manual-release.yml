name: Manual Quality Gate Release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full commit SHA to release from master.
        required: true
        type: string
      bump:
        description: Semantic version component to bump.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: quality-gate-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
    steps:
      - name: Checkout release gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Check quality and security gates
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/check-workflow-gates.sh \
            --repository "$REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --required-workflow "Quality Gate Tests" \
            --required-workflow Security >> "$GITHUB_OUTPUT"

  release:
    needs: release-gate
    if: needs.release-gate.outputs.ready == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_branch: master
      target_sha: ${{ inputs.target_sha }}
      toolkit_ref: ${{ inputs.target_sha }}
      bump: ${{ inputs.bump }}
      floating_tag: quality-gate-latest
      tag_prefix: quality-gate-v
