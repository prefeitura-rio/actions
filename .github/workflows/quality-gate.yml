name: Quality Gate

on:
  workflow_call:
    inputs:
      project-name:
        description: Stable project name shown in job names.
        type: string
        required: true
      working-directory:
        description: Project directory relative to the caller repository root.
        type: string
        required: true

permissions:
  contents: read

jobs:
  detect:
    name: ${{ inputs.project-name }} / Detect
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        id: detect
        with:
          check: detect-only
          working-directory: ${{ inputs.working-directory }}

  format:
    name: ${{ inputs.project-name }} / Format
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        with:
          check: app:format
          working-directory: ${{ inputs.working-directory }}
          language: ${{ matrix.language }}

  lint:
    name: ${{ inputs.project-name }} / Lint
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        with:
          check: app:lint
          working-directory: ${{ inputs.working-directory }}
          language: ${{ matrix.language }}

  strlint:
    name: ${{ inputs.project-name }} / Structural Lint
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        with:
          check: app:strlint
          working-directory: ${{ inputs.working-directory }}
          language: ${{ matrix.language }}

  typecheck:
    name: ${{ inputs.project-name }} / Type Check
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        with:
          check: app:typecheck
          working-directory: ${{ inputs.working-directory }}
          language: ${{ matrix.language }}

  test:
    name: ${{ inputs.project-name }} / Test
    needs: [detect, format, lint, strlint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefeitura-rio/actions/quality-gate@quality-gate-latest
        with:
          check: app:test
          working-directory: ${{ inputs.working-directory }}
          language: ${{ matrix.language }}
