  error-gofumpt-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat <<'EOF' > "$HOME/.local/bin/curl"
          #!/usr/bin/env bash
          set -euo pipefail
          output_file=""
          url=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -o)
                output_file="$2"
                shift 2
                ;;
              -fsSL|-sSL|-fL|-L|-s|-f)
                shift
                ;;
              http*://*)
                url="$1"
                shift
                ;;
              *)
                shift
                ;;
            esac
          done
          if [[ -z "$output_file" ]]; then
            echo "mock curl error: missing -o destination" >&2
            exit 2
          fi
          if [[ "$url" != *"gofumpt"* ]]; then
            echo "mock curl error: unexpected URL: $url" >&2
            exit 2
          fi
          echo "corrupted-gofumpt" > "$output_file"
          EOF
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run format on go project with corrupted download
        id: gofumpt-mismatch
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/go/fixtures/pass
          expected-failure: true
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        env:
          ACTUAL: ${{ steps.gofumpt-mismatch.outputs.error_message }}
        run: |
          [[ "${{ steps.gofumpt-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on gofumpt sha mismatch but it succeeded"
            exit 1
          }
          [[ "$ACTUAL" == *"Error:"* && "$ACTUAL" == *"gofumpt could not be installed."* && "$ACTUAL" == *"sha256 mismatch for gofumpt"* && "$ACTUAL" == *"How to fix it:"* ]] || {
            echo "::error::Expected a structured gofumpt installation failure, got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/gofumpt" ]] || {
            echo "::error::Corrupted gofumpt binary was not deleted after sha mismatch"
            exit 1
          }

  error-ast-grep-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat <<'EOF' > "$HOME/.local/bin/curl"
          #!/usr/bin/env bash
          set -euo pipefail
          output_file=""
          url=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -o)
                output_file="$2"
                shift 2
                ;;
              -fsSL|-sSL|-fL|-L|-s|-f)
                shift
                ;;
              http*://*)
                url="$1"
                shift
                ;;
              *)
                shift
                ;;
            esac
          done
          if [[ -z "$output_file" ]]; then
            echo "mock curl error: missing -o destination" >&2
            exit 2
          fi
          if [[ "$url" != *"ast-grep"* ]]; then
            echo "mock curl error: unexpected URL: $url" >&2
            exit 2
          fi
          echo "corrupted-ast-grep" > "$output_file"
          EOF
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run strlint on go project with corrupted download
        id: astgrep-mismatch
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/go/fixtures/pass
          expected-failure: true
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        run: |
          [[ "${{ steps.astgrep-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ast-grep sha mismatch but it succeeded"
            exit 1
          }
          ACTUAL="${{ steps.astgrep-mismatch.outputs.error_message }}"
          EXPECTED="sha256 mismatch for ast-grep"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/sg.zip" ]] || {
            echo "::error::Corrupted ast-grep archive was not deleted after sha mismatch"
            exit 1
          }

  error-multi-language-no-override:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run format on multi-language directory without override
        id: multi-lang
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/multiple-languages
          expected-failure: true
        continue-on-error: true
      - name: assert multi-language error
        run: |
          [[ "${{ steps.multi-lang.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on multi-language repo without override"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.multi-lang.outputs.error_message }}"
          EXPECTED="Multiple supported languages detected: go python typescript. Run quality-gate once per language, or use the detect-only check to enumerate languages."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  python-org-fallback:
    name: Python / org-fallback / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: app:lint
            fixture: quality-gate/python/fixtures/lint-fail-org-fallback
            expected_pattern: "B006"
            description: "ruff (org config) to report B006 mutable default argument"
          - check: app:typecheck
            fixture: quality-gate/python/fixtures/typecheck-fail-org-fallback
            expected_pattern: "reportMissingParameterType"
            description: "basedpyright (org config) to report reportMissingParameterType"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run ${{ matrix.check }} using org-fallback config
        id: org-fallback
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}
          expected-failure: true
        continue-on-error: true
      - name: assert org-config violation detected
        env:
          ERROR_MESSAGE: ${{ steps.org-fallback.outputs.error_message }}
          EXPECTED_PATTERN: ${{ matrix.expected_pattern }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          [[ "${{ steps.org-fallback.outcome }}" == "failure" ]] || {
            echo "::error::Expected ${{ matrix.check }} to fail using org fallback config but gate passed"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"$EXPECTED_PATTERN"* ]] || {
            echo "::error::Expected $DESCRIPTION but pattern '$EXPECTED_PATTERN' not found in error message"
            exit 1
          }

  python-setup-py-rejected:
    name: Python / setup.py-only / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:lint, app:typecheck, app:test]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run ${{ matrix.check }} on setup.py-only project
        id: setup-py
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: quality-gate/fixtures/error/setup-py-only
          expected-failure: true
        continue-on-error: true
      - name: assert setup.py project was rejected
        env:
          ERROR_MESSAGE: ${{ steps.setup-py.outputs.error_message }}
        run: |
          [[ "${{ steps.setup-py.outcome }}" == "failure" ]] || {
            echo "::error::Expected ${{ matrix.check }} to fail on setup.py-only project but it succeeded"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"setup.py-only projects are not supported"* ]] || {
            echo "::error::Expected explicit setup.py rejection in ${{ matrix.check }} error message"
            exit 1
          }

  typescript-typecheck-bad-script:
    name: TypeScript / typecheck-bad-script validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run typecheck on project with invalid typecheck script
        id: bad-script
        uses: ./quality-gate
        with:
          check: app:typecheck
          working-directory: quality-gate/typescript/fixtures/typecheck-bad-script
          expected-failure: true
        continue-on-error: true
      - name: assert invalid typecheck script was rejected
        env:
          ERROR_MESSAGE: ${{ steps.bad-script.outputs.error_message }}
        run: |
          [[ "${{ steps.bad-script.outcome }}" == "failure" ]] || {
            echo "::error::Expected app:typecheck to fail on project with 'exit 0' typecheck script"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"does not invoke a recognised type-checker"* ]] || {
            echo "::error::Expected explicit rejection of invalid typecheck script"
            exit 1
          }

  typescript-test-unknown-script:
    name: TypeScript / test-unknown-script advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run app:test on project with unrecognised test script
        id: unknown-test
        uses: ./quality-gate
        with:
          check: app:test
          working-directory: quality-gate/typescript/fixtures/test-unknown-script
      - name: assert advisory warning did not block the gate
        run: |
          [[ "${{ steps.unknown-test.outcome }}" == "success" ]] || {
            echo "::error::Expected advisory mode to not block the gate for unknown test script"
            exit 1
          }

  repo-rule-precedence:
    name: repo-rule configuration precedence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run strlint on multiple-rule-configs fixture
        id: precedence
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/fixtures/error/multiple-rule-configs
          expected-failure: true
        continue-on-error: true
      - name: assert precedence rule was executed
        env:
          ERROR_MESSAGE: ${{ steps.precedence.outputs.error_message }}
        run: |
          [[ "${{ steps.precedence.outcome }}" == "failure" ]] || {
            echo "::error::Expected multiple-rule-configs fixture to fail"
            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"root-precedence-rule"* ]] || {
            echo "::error::Expected root-precedence-rule to be detected"
            exit 1
          }
          [[ "$ERROR_MESSAGE" != *"dot-qg-shadowed-rule"* ]] || {
            echo "::error::Shadowed .quality-gate rule should not have run when root config is present"
            exit 1
          }
