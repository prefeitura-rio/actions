name: Quality Gate Tests

on:
  push:
    branches: [master, quality-gate]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/fixtures/go/pass
            fail: quality-gate/fixtures/go/format-fail
          - check: app:lint
            fixture: quality-gate/fixtures/go/pass
            fail: quality-gate/fixtures/go/lint-fail
          - check: app:strlint
            fixture: quality-gate/fixtures/go/pass
            fail: quality-gate/fixtures/go/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/fixtures/go/pass
            fail: quality-gate/fixtures/go/typecheck-fail
          - check: app:test
            fixture: quality-gate/fixtures/go/pass
            fail: quality-gate/fixtures/go/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: go-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.go-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.go-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: go-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        run: |
          [[ "${{ steps.go-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:test]
        include:
          - check: app:format
            fixture: quality-gate/fixtures/python/pass
            fail: quality-gate/fixtures/python/format-fail
          - check: app:lint
            fixture: quality-gate/fixtures/python/pass
            fail: quality-gate/fixtures/python/lint-fail
          - check: app:strlint
            fixture: quality-gate/fixtures/python/pass
            fail: quality-gate/fixtures/python/strlint-fail
          - check: app:test
            fixture: quality-gate/fixtures/python/pass
            fail: quality-gate/fixtures/python/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: py-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.py-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.py-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: py-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        run: |
          [[ "${{ steps.py-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [app:format, app:lint, app:strlint, app:typecheck, app:test]
        include:
          - check: app:format
            fixture: quality-gate/fixtures/typescript/pass
            fail: quality-gate/fixtures/typescript/format-fail
          - check: app:lint
            fixture: quality-gate/fixtures/typescript/pass
            fail: quality-gate/fixtures/typescript/lint-fail
          - check: app:strlint
            fixture: quality-gate/fixtures/typescript/pass
            fail: quality-gate/fixtures/typescript/strlint-fail
          - check: app:typecheck
            fixture: quality-gate/fixtures/typescript/pass
            fail: quality-gate/fixtures/typescript/typecheck-fail
          - check: app:test
            fixture: quality-gate/fixtures/typescript/pass
            fail: quality-gate/fixtures/typescript/test-fail
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "pass | ${{ matrix.check }}"
        id: ts-pass
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fixture }}

      - name: assert pass succeeded
        run: |
          [[ "${{ steps.ts-pass.outcome }}" == "success" ]] || {
            echo "::error::Expected pass on ${{ matrix.fixture }} but got ${{ steps.ts-pass.outcome }}"
            exit 1
          }

      - name: "fail | ${{ matrix.check }}"
        id: ts-fail
        uses: ./quality-gate
        with:
          check: ${{ matrix.check }}
          working-directory: ${{ matrix.fail }}
        continue-on-error: true

      - name: assert fail was detected
        run: |
          [[ "${{ steps.ts-fail.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ${{ matrix.fail }} but it succeeded"
            exit 1
          }

  error-invalid-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run with invalid check
        id: bad-check
        uses: ./quality-gate
        with:
          check: app:invalid
        continue-on-error: true
      - name: assert invalid check was rejected
        run: |
          [[ "${{ steps.bad-check.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on invalid check but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.bad-check.outputs.error_message }}"
          EXPECTED="Invalid check 'app:invalid'. Valid values: app:format app:lint app:strlint app:typecheck app:test"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-no-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run against empty directory
        id: no-lang
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/no-language
        continue-on-error: true
      - name: assert no-language error
        run: |
          [[ "${{ steps.no-lang.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on empty directory but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-lang.outputs.error_message }}"
          EXPECTED="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-ts-no-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run typecheck on TS project without lockfile
        id: no-lockfile
        uses: ./quality-gate
        with:
          check: app:typecheck
          working-directory: quality-gate/fixtures/error/ts-no-lockfile
        continue-on-error: true
      - name: assert lockfile error
        run: |
          [[ "${{ steps.no-lockfile.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on missing lockfile but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-lockfile.outputs.error_message }}"
          EXPECTED="No lockfile found for TypeScript project. Commit pnpm-lock.yaml (pnpm) or package-lock.json (npm)."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-ts-no-tsconfig:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: run format on package.json without tsconfig.json
        id: no-tsconfig
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/error/ts-no-tsconfig
        continue-on-error: true
      - name: assert no-language error (not TypeScript)
        run: |
          [[ "${{ steps.no-tsconfig.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail when tsconfig.json is missing but it succeeded"
            exit 1
          }
      - name: assert exact error message
        run: |
          ACTUAL="${{ steps.no-tsconfig.outputs.error_message }}"
          EXPECTED="Could not detect a supported language. Expected go.mod, pyproject.toml, or package.json+tsconfig.json."
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }

  error-gofumpt-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          # shellcheck disable=SC2016 # single quotes are intentional: this is the mock script's literal body
          printf '#!/usr/bin/env bash\necho "corrupted" > "${@: -1}"\n' \
            > "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run format on go project with corrupted download
        id: gofumpt-mismatch
        uses: ./quality-gate
        with:
          check: app:format
          working-directory: quality-gate/fixtures/go/pass
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        run: |
          [[ "${{ steps.gofumpt-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on gofumpt sha mismatch but it succeeded"
            exit 1
          }
          ACTUAL="${{ steps.gofumpt-mismatch.outputs.error_message }}"
          EXPECTED="sha256 mismatch for gofumpt"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/gofumpt" ]] || {
            echo "::error::Corrupted gofumpt binary was not deleted after sha mismatch"
            exit 1
          }

  error-ast-grep-sha-mismatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install mock curl (writes garbage to output file)
        run: |
          mkdir -p "$HOME/.local/bin"
          # shellcheck disable=SC2016 # single quotes are intentional: this is the mock script's literal body
          printf '#!/usr/bin/env bash\necho "corrupted" > "${@: -1}"\n' \
            > "$HOME/.local/bin/curl"
          chmod +x "$HOME/.local/bin/curl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: run strlint on go project with corrupted download
        id: astgrep-mismatch
        uses: ./quality-gate
        with:
          check: app:strlint
          working-directory: quality-gate/fixtures/go/pass
        continue-on-error: true
      - name: assert sha mismatch detected, message correct, file cleaned up
        run: |
          [[ "${{ steps.astgrep-mismatch.outcome }}" == "failure" ]] || {
            echo "::error::Expected action to fail on ast-grep sha mismatch but it succeeded"
            exit 1
          }
          ACTUAL="${{ steps.astgrep-mismatch.outputs.error_message }}"
          EXPECTED="sha256 mismatch for ast-grep"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "::error::Wrong error message. Expected: '${EXPECTED}' — Got: '${ACTUAL}'"
            exit 1
          }
          [[ ! -f "$HOME/.quality-gate-tools/dl/sg.zip" ]] || {
            echo "::error::Corrupted ast-grep archive was not deleted after sha mismatch"
            exit 1
          }
