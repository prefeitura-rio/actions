name: Workflow Refs

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"

concurrency:
  group: workflow-refs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reusable-workflow-refs:
    name: Reusable workflow internal refs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check that pinned reusable workflows pin their internal parts
        run: bash .github/scripts/tests/test-check-reusable-workflow-refs.sh
