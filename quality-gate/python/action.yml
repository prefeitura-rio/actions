name: Quality Gate (Python)
description: Run portable Python quality checks through the GitHub adapter.
inputs:
  check:
    description: The quality check to run.
    required: true
  working-directory:
    description: The project directory to check.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: python | setup uv
      if: (inputs.check == 'app:format' || inputs.check == 'app:lint' || inputs.check == 'app:typecheck' || inputs.check == 'app:test')
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: 0.12.5
        working-directory: ${{ inputs.working-directory }}
    - name: python | run portable check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
        QUALITY_GATE_ERROR_FILE: ${{ runner.temp }}/quality-gate-error.txt
      run: |
        set -euo pipefail
        bash "${ACTION_DIRECTORY}/scripts/check.sh" \
          --check "$CHECK" \
          --working-directory "$PWD" \
          --action-directory "$ACTION_DIRECTORY"
