id: no-print
language: Python
severity: error
message: >
  Avoid print() in production code. Use a structured logger
  (logging.getLogger(__name__)) so log levels, formatting,
  and destinations are controlled centrally.
rule:
  pattern: print($$$ARGS)
ignores:
  - "tests/**"
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/conftest.py"
