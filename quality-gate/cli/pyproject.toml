[project]
name = "quality-gate"
version = "0.1.0"
description = "Custom quality-gate checks of prefeitura-rio/actions, exposed as a Typer CLI."
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
quality-gate = "quality_gate.cli:main"

[dependency-groups]
dev = ["basedpyright>=1.29", "pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gate"]

[tool.ruff]
# Dogfood the organization's strict Python fallback configuration.
extend = "../python/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Typer reads option defaults from function signatures.
"src/quality_gate/cli.py" = ["FBT001", "FBT002", "FBT003", "PLR0913", "PLR0917"]
"tests/**" = ["PLR0913"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "all"
failOnWarnings = true
# Ruff's ISC rules and formatter prefer implicit concatenation of long strings.
reportImplicitStringConcatenation = false
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
