name: Quality Gate
description: |
  Language-agnostic quality gate. Detects the project language and dispatches
  the requested check to the language-specific action. Vue and Nuxt projects
  use the TypeScript action with framework-aware checks.
inputs:
  check:
    description: |
      The quality check to run, in app:<job> form. Valid values:
      app:format | app:lint | app:strlint | app:typecheck | app:test | detect-only
    required: true
  working-directory:
    description: The directory to run quality-gate checks in.
    required: false
    default: .
  language:
    description: |
      Explicit language override (go, python, typescript).
      When provided, skips file-based detection and uses this value directly.
      When omitted, detection runs from marker files (go.mod, pyproject.toml,
      setup.py, package.json+tsconfig.json). Vue and Nuxt remain TypeScript
      projects for dispatch and workflow matrix purposes.
    required: false
  expected-failure:
    description: |
      When true, adds a test scenario section to the job summary indicating
      the failure is expected. Used by the quality-gate-tests workflow for
      negative-test fixtures.
    required: false
    default: 'false'
outputs:
  error_message:
    description: Human-readable error message set when the action fails.
    value: ${{ steps.collect-error.outputs.error_message }}
  languages:
    description: |
      JSON array of detected languages, e.g. ["go","typescript"].
      Set only when check is detect-only. Empty for normal checks.
    value: ${{ steps.lang.outputs.languages }}
  summary_name:
    description: Friendly check, language, and framework name used in the job summary.
    value: ${{ steps.summary.outputs.name }}
runs:
  using: composite
  steps:
    - name: Init error relay
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: |
        set -euo pipefail
        relay="$RUNNER_TEMP/quality-gate-error.txt"
        log="$RUNNER_TEMP/quality-gate-output.log"
        bash_env="$RUNNER_TEMP/quality-gate-bash-env"
        success="$RUNNER_TEMP/quality-gate-success"

        : > "$relay"
        : > "$log"
        rm -f "$success"
        cat > "$bash_env" <<EOF
        QUALITY_GATE_ERROR_FILE="$relay"
        QUALITY_GATE_OUTPUT_LOG="$log"
        source "$ACTION_DIRECTORY/scripts/capture-failure.sh"
        EOF
        echo "BASH_ENV=$bash_env" >> "$GITHUB_ENV"
    - name: Validate check input
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        if ! QUALITY_GATE_ERROR_FILE="$RUNNER_TEMP/quality-gate-error.txt" \
          bash "${ACTION_DIRECTORY}/scripts/validate-check.sh" "$CHECK"; then
          MSG=$(<"$RUNNER_TEMP/quality-gate-error.txt")
          echo "::error title=quality-gate::${MSG}"
          exit 1
        fi
    - name: Detect language
      id: lang
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        LANGUAGE: ${{ inputs.language }}
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        if ! output=$(QUALITY_GATE_ERROR_FILE="$RUNNER_TEMP/quality-gate-error.txt" \
          bash "${ACTION_DIRECTORY}/scripts/detect-languages.sh" \
            --check "$CHECK" \
            --language "$LANGUAGE" \
            --working-directory "$PWD"); then
          MSG=$(<"$RUNNER_TEMP/quality-gate-error.txt")
          echo "::error title=quality-gate::${MSG}"
          exit 1
        fi
        printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
    - name: Run Go quality gate
      if: steps.lang.outputs.name == 'go'
      uses: $/quality-gate/go
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run Python quality gate
      if: steps.lang.outputs.name == 'python'
      uses: $/quality-gate/python
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run TypeScript quality gate
      id: typescript
      if: steps.lang.outputs.name == 'typescript'
      uses: $/quality-gate/typescript
      with:
        check: ${{ inputs.check }}
        working-directory: ${{ inputs.working-directory }}
    - name: Mark quality gate success
      shell: bash
      run: touch "$RUNNER_TEMP/quality-gate-success"
    - name: Collect error message
      id: collect-error
      if: always()
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        output=$(bash "${ACTION_DIRECTORY}/scripts/collect-error.sh" \
          --check "$CHECK" \
          --error-file "$RUNNER_TEMP/quality-gate-error.txt" \
          --success-file "$RUNNER_TEMP/quality-gate-success")
        if [[ -n "$output" ]]; then
          delimiter="QUALITY_GATE_ERROR_$(date +%s%N)"
          {
            printf 'error_message<<%s\n' "$delimiter"
            printf '%s\n' "$output"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        fi
        echo "BASH_ENV=" >> "$GITHUB_ENV"
    - name: Write quality gate summary
      id: summary
      if: always()
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
        LANGUAGE: ${{ steps.lang.outputs.name }}
        FRAMEWORK: ${{ steps.typescript.outputs.framework }}
        EXPECTED_FAILURE: ${{ inputs.expected-failure }}
      run: |
        set -euo pipefail
        name_file="$RUNNER_TEMP/quality-gate-summary-name"
        summary_file="$RUNNER_TEMP/quality-gate-summary.md"
        summary_args=(
          --check "$CHECK"
          --language "$LANGUAGE"
          --framework "$FRAMEWORK"
          --error-file "$RUNNER_TEMP/quality-gate-error.txt"
          --success-file "$RUNNER_TEMP/quality-gate-success"
          --name-file "$name_file"
          --summary-file "$summary_file"
        )
        if [[ "$EXPECTED_FAILURE" == true ]]; then
          summary_args+=(--expected-failure)
        fi
        status=0
        bash "${ACTION_DIRECTORY}/scripts/render-summary.sh" "${summary_args[@]}" || status=$?
        printf 'name=%s\n' "$(<"$name_file")" >> "$GITHUB_OUTPUT"
        cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
