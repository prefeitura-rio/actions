name: Reusable Build and Release with version autobump

on:
  workflow_call:
    inputs:
      push:
        description: "Push image and git tag (set false for CI/PR dry-runs)"
        required: false
        type: boolean
        default: false
      context:
        description: "Docker build context path"
        required: false
        type: string
        default: "."
      git_tag_prefix:
        description: "Optional prefix to attatch to git tags (ex.: frontend-, backend-)"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile (optional, defaults to <context>/Dockerfile)"
        required: false
        type: string
        default: ""
      image_name:
        description: "Docker image name (optional, defaults to ghcr.io/<owner>/<repo>)"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      sign:
        description: "Sign image and attach SLSA provenance (needs org PROVENANCE_* vars)"
        required: false
        type: boolean
        default: true
      scan_image:
        description: "Scan the built image (grype) and upload to DefectDojo"
        required: false
        type: boolean
        default: true
      ts_tags:
        description: "Tailscale tags used to reach DefectDojo for image scan upload"
        required: false
        type: string
        default: ""
    secrets:
      DD_API_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false

jobs:
  build-and-release:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image_name }}
      digest: ${{ steps.build.outputs.digest }}
      skip: ${{ steps.guard.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine Image Name
        id: img
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            IMAGE="${{ inputs.image_name }}"
          else
            IMAGE="ghcr.io/${{ github.repository }}"
          fi
          echo "image_name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        run: |
          PREFIX="${{ inputs.git_tag_prefix }}"
          if [ -n "$PREFIX" ]; then
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^${PREFIX}v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1)
          else
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          fi

          BRANCH="${GITHUB_REF##*/}"

          if [ -z "$LATEST_TAG" ]; then
            echo "First release: Setting initial version to v1.0.0"
            HAS_TAG="false"
            NEXT_VERSION="1.0.0"
          else
            HAS_TAG="true"
            CLEAN_VER="${LATEST_TAG#$PREFIX}"
            CLEAN_VER="${CLEAN_VER#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)

            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            TAG="v$NEXT_VERSION"
          else
            TAG="v$NEXT_VERSION-rc.${{ github.run_number }}"
          fi

          {
            echo "tag=$TAG"
            echo "latest_tag=$LATEST_TAG"
            echo "has_tag=$HAS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if no app changes since last release
        id: guard
        run: |
          if [ "${{ steps.version.outputs.has_tag }}" == "true" ] && [ "${GITHUB_REF##*/}" == "main" || "${GITHUB_REF##*/}" == "master" ]; then
            LAST_TAG="${{ steps.version.outputs.latest_tag }}"

            if ! git diff --name-only "$LAST_TAG" HEAD -- "${{ inputs.context }}" | grep -q .; then
              echo "No changes in ${{ inputs.context }} since $LAST_TAG — skipping build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.guard.outputs.skip != 'true' && inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Build and push Docker image
        id: build
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.6.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile ||format('{0}/Dockerfile', inputs.context) }}
          push: ${{ inputs.push }}
          tags: ${{ steps.img.outputs.image_name }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Git Tag
        if: steps.guard.outputs.skip != 'true' && inputs.push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          GIT_TAG="${{ inputs.git_tag_prefix }}${{ steps.version.outputs.tag }}"

          if git rev-parse "$GIT_TAG" >/dev/null 2>&1; then
            echo "Tag Git $GIT_TAG já existe. Pulando."
          else
            git tag "$GIT_TAG"
            git push origin "$GIT_TAG"
          fi

  provenance:
    needs: build-and-release
    if: >-
      inputs.push && inputs.sign &&
      needs.build-and-release.outputs.skip != 'true' &&
      needs.build-and-release.outputs.digest != '' &&
      vars.PROVENANCE_WIF_PROVIDER != ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      id-token: write
      packages: write
    env:
      IMAGE_DIGEST: ${{ needs.build-and-release.outputs.image }}@${{ needs.build-and-release.outputs.digest }}
      KMS_KEY: ${{ vars.PROVENANCE_KMS_KEY }}
      BUILDER_ID: https://github.com/prefeitura-rio/actions/.github/workflows/build-and-release.yml@refs/heads/master
    steps:
      - name: Checkout provenance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: prefeitura-rio/actions
          ref: master
          path: _provenance

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PROVENANCE_WIF_PROVIDER }}
          service_account: ${{ vars.PROVENANCE_SIGNER_SA }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA provenance predicate
        run: _provenance/provenance/scripts/generate-predicate.sh > predicate.json

      - name: Sign and attach provenance
        env:
          PREDICATE_FILE: predicate.json
        run: _provenance/provenance/scripts/sign-provenance.sh

      - name: Install syft
        run: _provenance/provenance/scripts/install-scanners.sh syft

      - name: Generate image SBOM
        run: _provenance/provenance/scripts/generate-sbom.sh

      - name: Sign and attach SBOM attestation
        env:
          PREDICATE_TYPE: cyclonedx
          PREDICATE_FILE: image-sbom.cdx.json
        run: _provenance/provenance/scripts/sign-provenance.sh

  image-scan:
    needs: build-and-release
    if: >-
      inputs.push && inputs.scan_image &&
      needs.build-and-release.outputs.skip != 'true' &&
      needs.build-and-release.outputs.digest != ''
    runs-on: ${{ inputs.runs_on }}
    permissions:
      packages: read
    env:
      IMAGE_DIGEST: ${{ needs.build-and-release.outputs.image }}@${{ needs.build-and-release.outputs.digest }}
      DD_URL: ${{ vars.DD_URL }}
      DD_API_TOKEN: ${{ secrets.DD_API_TOKEN }}
      PRODUCT_NAME: ${{ github.repository }}
      ENGAGEMENT_NAME: ${{ github.ref_name }}
      CURRENT_BRANCH: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout provenance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: prefeitura-rio/actions
          ref: master
          path: _provenance

      - name: Connect to Tailscale
        if: env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.ts_tags }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft and grype
        run: _provenance/provenance/scripts/install-scanners.sh syft grype

      - name: Scan image and upload to DefectDojo
        run: _provenance/provenance/scripts/scan-image.sh
