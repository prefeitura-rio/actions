            exit 1
          }
          [[ "$ERROR_MESSAGE" == *"no-local-forbidden"* ]] || {
            echo "::error::Expected repository-local rule no-local-forbidden to be reported"
            exit 1
          }

  mandatory-policy-rules:
    name: mandatory policy / ${{ matrix.rule }}
    runs-on: ubuntu-latest
